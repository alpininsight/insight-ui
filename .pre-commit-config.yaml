exclude: '^docs/|/migrations/|staticfiles|bin|.data|.venv|htmlcov|site|node_modules'

default_language_version:
  python: python3

repos:
  # Lightweight general hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-toml
      - id: check-json
      - id: fix-byte-order-marker
      - id: debug-statements
      - id: detect-private-key
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: no-commit-to-branch
        stages: [pre-commit]
        args: ["--branch", "main", "--branch", "develop"]

  # Ruff lint + format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: ["--fix"]
        stages: [pre-commit, pre-push]
      - id: ruff-format
        stages: [pre-commit, pre-push]

  # Modernize Python syntax
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: ["--py312-plus"]

  # Modernize Django code (optional but useful)
  - repo: https://github.com/adamchainz/django-upgrade
    rev: 1.31.1
    hooks:
      - id: django-upgrade
        args: ["--target-version", "5.2"]

  # Security scan (lightweight; consider moving to pre-push if slow)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ['--exclude', 'tests']
        files: \.py$

  # Secret scanning (Gitleaks)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # Conventional Commits (commit-msg validation)
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.17.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # Format Django HTML templates (runs only when templates exist)
  - repo: https://github.com/rtts/djhtml
    rev: "3.0.11"
    hooks:
      - id: djhtml
        files: '(^|/)templates/.*\.html$'

  # Sort Tailwind CSS classes, check used design tokens
  - repo: local
    hooks:
      - id: utility-sort
        name: Sort utility CSS classes
        entry: uv run python scripts/sort_utility_classes.py
        language: system
        files: '(^|/)templates/.*\.html$'

      - id: design-tokens
        name: Check design token usage
        entry: uv run python scripts/check_design_tokens.py
        language: system
        files: '(^|/)templates/.*\.html$'
        require_serial: true

  # Optional: pytest, migrations, and system checks for the demo Django project
  - repo: local
    hooks:
      - id: pytest
        name: Run pytest (pre-push)
        entry: bash
        args: ["-lc", "PYTHONPATH=. uv run pytest -q"]
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: django-migrations-check
        name: Check for missing migrations
        entry: bash
        args: ["-lc", "PYTHONPATH=. uv run python manage.py makemigrations --check --dry-run"]
        language: system
        pass_filenames: false

      - id: django-system-check
        name: Django system check (pre-push)
        entry: bash
        args: ["-lc", "PYTHONPATH=. uv run python manage.py check --deploy --fail-level ERROR"]
        language: system
        pass_filenames: false
        stages: [pre-push]
