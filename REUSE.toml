version = 1
SPDX-PackageName = "insight-ui"
SPDX-PackageSupplier = "Alpin Insight Solutions GmbH & Co. KG <kontakt@alpininsight.com>"
SPDX-PackageDownloadLocation = "https://github.com/alpininsight/insight-ui"

# Default for every file in the repository. Source files additionally carry SPDX
# headers; where a header exists it takes precedence (closest wins).
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2025-2026 Alpin Insight Solutions GmbH & Co. KG"
SPDX-License-Identifier = "AGPL-3.0-only"

# Repository plumbing, lock files and generated metadata: no creative content.
[[annotations]]
path = [
    ".github/**",
    ".gitignore",
    ".dockerignore",
    ".python-version",
    ".pre-commit-config.yaml",
    ".actrc",
    "GitVersion.yml",
    "cliff.toml",
    "package.json",
    "package-lock.json",
    "uv.lock",
    "pytest.ini",
    "vitest.config.js",
    "REUSE.toml",
    "CHANGELOG.md",
    "CONTRIBUTORS.md",
]
precedence = "override"
SPDX-FileCopyrightText = "2025-2026 Alpin Insight Solutions GmbH & Co. KG"
SPDX-License-Identifier = "CC0-1.0"

# Bundled font: Atkinson Hyperlegible Next, SIL Open Font License 1.1.
# The OFL text ships next to the font file as required by the licence.
[[annotations]]
path = [
    "insight_ui/static/insight_ui/font/AtkinsonHyperlegibleNext-VariableFont_wght.ttf",
    "insight_ui/static/insight_ui/font/OFL.txt",
]
precedence = "override"
SPDX-FileCopyrightText = "2020-2024 The Atkinson Hyperlegible Next Project Authors (https://github.com/googlefonts/atkinson-hyperlegible-next)"
SPDX-License-Identifier = "OFL-1.1"

# Bundled icon library: the SVG paths are Heroicons (MIT, Tailwind Labs, Inc.); the
# Python module around them is Insight UI code.
[[annotations]]
path = "insight_ui/icons.py"
precedence = "override"
SPDX-FileCopyrightText = [
    "2025-2026 Alpin Insight Solutions GmbH & Co. KG",
    "Tailwind Labs, Inc. (Heroicons)",
]
SPDX-License-Identifier = "AGPL-3.0-only AND MIT"

# Generated stylesheet: Insight UI design tokens compiled with Tailwind CSS, which
# contributes its preflight and utilities (MIT, Tailwind Labs, Inc.).
[[annotations]]
path = "insight_ui/static/insight_ui/css/tailwind.css"
precedence = "override"
SPDX-FileCopyrightText = [
    "2025-2026 Alpin Insight Solutions GmbH & Co. KG",
    "Tailwind Labs, Inc. (Tailwind CSS)",
]
SPDX-License-Identifier = "AGPL-3.0-only AND MIT"
