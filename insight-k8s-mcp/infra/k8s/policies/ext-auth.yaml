---
# NetworkPolicy: Backend-Isolation
#
# Stellt sicher, dass MCP-Backend-Server nur vom Gateway-Pod
# angesprochen werden koennen -- nicht direkt von aussen.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-isolation
  namespace: mcp-system
  labels:
    app.kubernetes.io/part-of: insight-k8s-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: backend
  policyTypes:
    - Ingress
  ingress:
    # Nur vom Gateway-Pod auf Port 8080
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: gateway
      ports:
        - protocol: TCP
          port: 8080
---
# NetworkPolicy: Gateway-Ingress
#
# Gateway akzeptiert nur Traffic von Cloudflare IP-Ranges
# und Cluster-internen Quellen.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-ingress
  namespace: mcp-system
  labels:
    app.kubernetes.io/part-of: insight-k8s-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: gateway
  policyTypes:
    - Ingress
  ingress:
    # Cloudflare IPv4 Ranges
    # Quelle: https://www.cloudflare.com/ips-v4/
    # HINWEIS: Diese Liste muss aktuell gehalten werden.
    - from:
        - ipBlock:
            cidr: 173.245.48.0/20
        - ipBlock:
            cidr: 103.21.244.0/22
        - ipBlock:
            cidr: 103.22.200.0/22
        - ipBlock:
            cidr: 103.31.4.0/22
        - ipBlock:
            cidr: 141.101.64.0/18
        - ipBlock:
            cidr: 108.162.192.0/18
        - ipBlock:
            cidr: 190.93.240.0/20
        - ipBlock:
            cidr: 188.114.96.0/20
        - ipBlock:
            cidr: 197.234.240.0/22
        - ipBlock:
            cidr: 198.41.128.0/17
        - ipBlock:
            cidr: 162.158.0.0/15
        - ipBlock:
            cidr: 104.16.0.0/13
        - ipBlock:
            cidr: 104.24.0.0/14
        - ipBlock:
            cidr: 172.64.0.0/13
        - ipBlock:
            cidr: 131.0.72.0/22
      ports:
        - protocol: TCP
          port: 443
    # Cluster-interner Traffic (Health Checks, Probes)
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
