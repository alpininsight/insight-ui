---
# Secrets fuer Partner Trust-Zone
#
# Credentials fuer den Partner MCP-Endpoint.
#
# WICHTIG: Diese Datei zeigt die Secret-Struktur als Template.
# In Produktion: Sealed Secrets, External Secrets Operator, oder
# manuell erstellen. NIEMALS Klartext-Secrets committen.
#
# Hinweis: Die eigentliche OAuth-Konfiguration ist im MCPRoute
# (mcp-partner.yaml) unter spec.securityPolicy.oauth definiert.

# Platzhalter fuer Partner-Backend API-Keys
# Wird aktiviert sobald Partner-Backends definiert sind.
apiVersion: v1
kind: Secret
metadata:
  name: partner-backend-api-key
  namespace: mcp-system
  labels:
    app.kubernetes.io/part-of: insight-k8s-mcp
    insight.alpininsight.ai/trust-zone: partner
type: Opaque
stringData:
  # TODO: Ersetzen durch echten API-Key
  apiKey: "REPLACE_ME"
