---
# Secrets fuer Internal Trust-Zone
#
# Backend-Credentials fuer den internen MCP-Endpoint.
#
# WICHTIG: Diese Datei zeigt die Secret-Struktur als Template.
# In Produktion: Sealed Secrets, External Secrets Operator, oder
# manuell erstellen. NIEMALS Klartext-Secrets committen.
#
# Hinweis: Die eigentliche OAuth-Konfiguration (Issuer, Audiences, Scopes)
# ist im MCPRoute (mcp-internal.yaml) unter spec.securityPolicy.oauth
# definiert -- nicht als separates SecurityPolicy-CRD.

# API-Key fuer GitHub Backend (Suedseite: Gateway -> Backend)
# Das Secret muss den Key "apiKey" enthalten.
apiVersion: v1
kind: Secret
metadata:
  name: github-mcp-api-key
  namespace: mcp-system
  labels:
    app.kubernetes.io/part-of: insight-k8s-mcp
    insight.alpininsight.ai/trust-zone: internal
type: Opaque
stringData:
  # TODO: Ersetzen durch echten API-Key
  apiKey: "REPLACE_ME_GITHUB_TOKEN"
---
# GitHub MCP Server Credentials (fuer das Deployment selbst)
apiVersion: v1
kind: Secret
metadata:
  name: github-mcp-credentials
  namespace: mcp-system
  labels:
    app.kubernetes.io/part-of: insight-k8s-mcp
type: Opaque
stringData:
  # TODO: Ersetzen durch echten GitHub PAT oder App Token
  token: "REPLACE_ME"
