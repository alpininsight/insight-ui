---
# MCPRoute: Internal
#
# Aggregiert interne MCP-Backends (OpenAPI, GitHub, Context7) hinter
# mcp.alpininsight.ai/mcp. Authentifizierung ueber internen OIDC-Issuer.
#
# MCP-Clients (Claude, Codex, eigene Agents) verbinden sich mit diesem
# Endpoint und erhalten Zugriff auf alle internen Tools.
#
# Tool-Namen werden automatisch mit dem Backend-Namen prefixed:
#   openapi-mcp   -> openapi-mcp__list_apis, openapi-mcp__get_spec, ...
#   github-mcp    -> github-mcp__list_issues, github-mcp__get_file_contents, ...
#   context7-mcp  -> context7-mcp__resolve_library_id, context7-mcp__get_library_docs, ...
apiVersion: aigateway.envoyproxy.io/v1alpha1
kind: MCPRoute
metadata:
  name: mcp-internal
  namespace: mcp-system
  labels:
    app.kubernetes.io/part-of: insight-k8s-mcp
    app.kubernetes.io/component: mcproute
    insight.alpininsight.ai/trust-zone: internal
spec:
  # Bindung an das Gateway (parentRefs ist ein Array)
  parentRefs:
    - name: mcp-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
      namespace: mcp-system
      sectionName: https-mcp-internal

  # MCP-Endpoint-Pfad (Default: /mcp)
  path: "/mcp"

  # OAuth-Konfiguration (Nordseite -- Client -> Gateway)
  # Eingebettet in die MCPRoute, kein separates SecurityPolicy-CRD
  securityPolicy:
    oauth:
      issuer: "https://login.alpininsight.ai/realms/internal"
      audiences:
        - "https://mcp.alpininsight.ai/mcp"
      protectedResourceMetadata:
        resource: "https://mcp.alpininsight.ai/mcp"
        resourceName: "alpininsight Internal MCP Gateway"
        scopesSupported:
          - "openid"
          - "mcp:base"
          - "tools.openapi.read"
          - "tools.openapi.write"
          - "tools.github.read"
          - "tools.github.write"
          - "tools.context7.read"
        resourceDocumentation: "https://docs.alpininsight.ai/mcp"

    # Autorisierung: Scope-basierte Tool-Zugriffskontrolle
    authorization:
      defaultAction: Deny
      rules:
        # Basis-Zugriff (tools/list, ping) fuer alle authentifizierten Clients
        - source:
            jwt:
              scopes:
                - "mcp:base"

        # OpenAPI-Tools: Lesen
        - source:
            jwt:
              scopes:
                - "tools.openapi.read"
          target:
            tools:
              - backend: openapi-mcp

        # GitHub-Tools: Lesen
        - source:
            jwt:
              scopes:
                - "tools.github.read"
          target:
            tools:
              - backend: github-mcp

        # Context7-Tools: Lesen (Dokumentations-Lookup)
        - source:
            jwt:
              scopes:
                - "tools.context7.read"
          target:
            tools:
              - backend: context7-mcp

  # Backend MCP-Server (alle als ClusterIP Services im Namespace)
  backendRefs:
    # OpenAPI MCP Server -- API-Dokumentation als Tools
    - name: openapi-mcp
      kind: Service
      port: 8080
      path: "/mcp"

    # GitHub MCP Server -- Issues, PRs, Repos
    - name: github-mcp
      kind: Service
      port: 8080
      path: "/mcp"
      toolSelector:
        includeRegex:
          - ".*issues?.*"
          - ".*pull_requests?.*"
          - ".*repos?.*"
          - ".*search.*"
          - ".*file_contents.*"
      securityPolicy:
        apiKey:
          secretRef:
            name: github-mcp-api-key

    # Context7 MCP Server -- Library/Framework-Dokumentation
    - name: context7-mcp
      kind: Service
      port: 8080
      path: "/mcp"
