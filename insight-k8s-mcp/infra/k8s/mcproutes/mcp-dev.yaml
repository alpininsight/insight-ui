---
# MCPRoute: Dev
#
# Dev/Test-Endpoint. Kann auf Named Tunnel zum Notebook zeigen.
# Breiterer Zugang fuer Entwicklung -- alle Tools exponiert.
apiVersion: aigateway.envoyproxy.io/v1alpha1
kind: MCPRoute
metadata:
  name: mcp-dev
  namespace: mcp-system
  labels:
    app.kubernetes.io/part-of: insight-k8s-mcp
    app.kubernetes.io/component: mcproute
    insight.alpininsight.ai/trust-zone: dev
spec:
  parentRefs:
    - name: mcp-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
      namespace: mcp-system
      sectionName: https-mcp-dev

  path: "/mcp"

  securityPolicy:
    oauth:
      # Dev-Realm -- gleiches IdP, separater Realm/Audience
      issuer: "https://login.alpininsight.ai/realms/dev"
      audiences:
        - "https://mcp-dev.alpininsight.ai/mcp"
      protectedResourceMetadata:
        resource: "https://mcp-dev.alpininsight.ai/mcp"
        resourceName: "alpininsight Dev MCP Gateway"
        scopesSupported:
          - "openid"
          - "mcp:base"
          - "tools.openapi.read"
          - "tools.github.read"
          - "tools.context7.read"

    # Dev: Kein defaultAction: Deny -- alle authentifizierten Nutzer duerfen alles
    authorization:
      rules:
        - source:
            jwt:
              scopes:
                - "mcp:base"

  backendRefs:
    # Gleiche Backends wie Internal (Dev-Instanzen oder shared)
    - name: openapi-mcp
      kind: Service
      port: 8080
      path: "/mcp"

    - name: github-mcp
      kind: Service
      port: 8080
      path: "/mcp"
      securityPolicy:
        apiKey:
          secretRef:
            name: github-mcp-api-key

    - name: context7-mcp
      kind: Service
      port: 8080
      path: "/mcp"

    # Dev-spezifisch: Notebook MCP Server (via Cloudflare Tunnel)
    # Wird aktiviert sobald Tunnel konfiguriert ist
    # - name: notebook-mcp
    #   kind: Service
    #   port: 8080
    #   path: "/mcp"
