---
# MCPRoute: Partner
#
# Separater MCP-Endpoint fuer externe Partner.
# Eigener OIDC-Realm, eingeschraenkte Tool-Auswahl.
#
# Partner erhalten nur Zugriff auf explizit freigegebene Tools.
apiVersion: aigateway.envoyproxy.io/v1alpha1
kind: MCPRoute
metadata:
  name: mcp-partner
  namespace: mcp-system
  labels:
    app.kubernetes.io/part-of: insight-k8s-mcp
    app.kubernetes.io/component: mcproute
    insight.alpininsight.ai/trust-zone: partner
spec:
  parentRefs:
    - name: mcp-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
      namespace: mcp-system
      sectionName: https-mcp-partner

  path: "/mcp"

  securityPolicy:
    oauth:
      # Separater Realm fuer Partner
      issuer: "https://login.alpininsight.ai/realms/partner"
      audiences:
        - "https://mcp-partner.alpininsight.ai/mcp"
      protectedResourceMetadata:
        resource: "https://mcp-partner.alpininsight.ai/mcp"
        resourceName: "alpininsight Partner MCP Gateway"
        scopesSupported:
          - "openid"
          - "mcp:base"
          - "tools.partner.read"
          - "tools.partner.write"

    authorization:
      defaultAction: Deny
      rules:
        - source:
            jwt:
              scopes:
                - "mcp:base"

  # Backend-Referenzen -- Partner-spezifische MCP-Server
  # TODO: Partner-Backends hinzufuegen sobald definiert
  backendRefs: []
  # Beispiel:
  # backendRefs:
  #   - name: partner-data-mcp
  #     kind: Service
  #     port: 8080
  #     path: "/mcp"
  #     toolSelector:
  #       include:
  #         - get_partner_data
  #         - list_partner_resources
