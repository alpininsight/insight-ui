---
# GatewayClass -- Envoy AI Gateway Controller
#
# Wird durch die Installation von Envoy AI Gateway bereitgestellt.
# Hier explizit definiert fuer Reproduzierbarkeit.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-ai-gateway
  labels:
    app.kubernetes.io/part-of: insight-k8s-mcp
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
# Gateway -- Haupt-Einstiegspunkt fuer alle MCP-Endpoints
#
# Dieses Gateway stellt den zentralen Listener fuer alle MCP-Clients
# bereit. MCPRoutes binden sich ueber parentRefs an dieses Gateway.
#
# In Produktion terminiert Cloudflare TLS. Das Gateway kann
# HTTP hinter Cloudflare oder HTTPS mit eigenem Zertifikat betreiben.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mcp-gateway
  namespace: mcp-system
  labels:
    app.kubernetes.io/part-of: insight-k8s-mcp
    app.kubernetes.io/component: gateway
spec:
  gatewayClassName: envoy-ai-gateway
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: mcp-envoy-proxy
  listeners:
    # HTTPS-Listener fuer mcp.alpininsight.ai (Internal)
    - name: https-mcp-internal
      protocol: HTTPS
      port: 443
      hostname: mcp.alpininsight.ai
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: alpininsight-ai-tls
            namespace: mcp-system
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - group: aigateway.envoyproxy.io
            kind: MCPRoute

    # HTTPS-Listener fuer mcp-partner.alpininsight.ai (Partner)
    - name: https-mcp-partner
      protocol: HTTPS
      port: 443
      hostname: mcp-partner.alpininsight.ai
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: alpininsight-ai-tls
            namespace: mcp-system
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - group: aigateway.envoyproxy.io
            kind: MCPRoute

    # HTTPS-Listener fuer mcp-dev.alpininsight.ai (Dev)
    - name: https-mcp-dev
      protocol: HTTPS
      port: 443
      hostname: mcp-dev.alpininsight.ai
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: alpininsight-ai-tls
            namespace: mcp-system
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - group: aigateway.envoyproxy.io
            kind: MCPRoute
