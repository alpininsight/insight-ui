---
# Backend: Context7 MCP Server
#
# Stellt aktuelle Library- und Framework-Dokumentation als MCP-Tools bereit.
# Erlaubt MCP-Clients, Dokumentation zu suchen, Libraries aufzuloesen
# und kontextbezogene Code-Beispiele abzurufen.
#
# Tool-Namen werden automatisch vom Gateway mit dem Backend-Namen
# prefixed: context7-mcp__resolve_library_id, context7-mcp__get_library_docs, etc.
#
# Context7 benoetigt keine API-Keys -- oeffentlicher Zugang.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: context7-mcp
  namespace: mcp-system
  labels:
    app.kubernetes.io/name: context7-mcp
    app.kubernetes.io/part-of: insight-k8s-mcp
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: context7-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: context7-mcp
        app.kubernetes.io/part-of: insight-k8s-mcp
    spec:
      containers:
        - name: context7-mcp
          image: ghcr.io/alpininsight/context7-mcp:latest
          ports:
            - name: mcp
              containerPort: 8080
              protocol: TCP
          env:
            - name: MCP_SERVER_NAME
              value: "context7-mcp"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: mcp
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: mcp
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: context7-mcp
  namespace: mcp-system
  labels:
    app.kubernetes.io/name: context7-mcp
    app.kubernetes.io/part-of: insight-k8s-mcp
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: context7-mcp
  ports:
    - name: mcp
      port: 8080
      targetPort: mcp
      protocol: TCP
