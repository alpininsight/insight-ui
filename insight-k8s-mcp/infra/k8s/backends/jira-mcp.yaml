---
# Backend: Jira MCP Server
#
# Stellt Jira-Funktionalitaet als MCP-Tools bereit.
# Tickets, Boards, Sprints, Suche.
#
# Tool-Namespace: jira__*
# Beispiel-Tools:
#   - jira__search_issues
#   - jira__get_issue
#   - jira__create_issue
#   - jira__update_issue
#   - jira__list_projects
#   - jira__get_sprint
#
# Auth zum Jira API: API Token oder OAuth App Credentials
# als Kubernetes Secret bereitgestellt.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jira-mcp
  namespace: mcp-system
  labels:
    app.kubernetes.io/name: jira-mcp
    app.kubernetes.io/part-of: insight-k8s-mcp
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jira-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jira-mcp
        app.kubernetes.io/part-of: insight-k8s-mcp
    spec:
      containers:
        - name: jira-mcp
          # Jira MCP Server -- eigenes oder Community-Image
          image: ghcr.io/alpininsight/jira-mcp:latest
          ports:
            - name: mcp
              containerPort: 8080
              protocol: TCP
          env:
            - name: MCP_SERVER_NAME
              value: "jira-mcp"
            - name: MCP_TOOL_PREFIX
              value: "jira__"
            # Jira-Instanz URL
            - name: JIRA_BASE_URL
              value: "https://alpininsight.atlassian.net"
            # Jira API Credentials aus Secret
            - name: JIRA_USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: jira-mcp-credentials
                  key: email
            - name: JIRA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jira-mcp-credentials
                  key: token
            # Einschraenkung auf Projekte
            - name: JIRA_ALLOWED_PROJECTS
              value: "INSIGHT,OPS,DEV"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: mcp
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: mcp
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: jira-mcp
  namespace: mcp-system
  labels:
    app.kubernetes.io/name: jira-mcp
    app.kubernetes.io/part-of: insight-k8s-mcp
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jira-mcp
  ports:
    - name: mcp
      port: 8080
      targetPort: mcp
      protocol: TCP
