site_name: Django Insight UI
site_description: Ein modernes, barrierefreies UI-Framework für Django
site_author: Django Insight UI Team

repo_url: https://github.com/yourusername/django-insight-ui
edit_uri: edit/main/docs/

theme:
  name: material
  language: de
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Zum dunklen Modus wechseln
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Zum hellen Modus wechseln
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - navigation.indexes
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.share

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - i18n:
      languages:
        - locale: de
          name: Deutsch
          default: true
          build: true
        - locale: en
          name: English
          build: true
          nav:
            - Home: index.en.md
            - Installation: installation.en.md
            - Quickstart: quickstart.en.md
            - Components:
                - Overview: components/index.en.md
                - Navbar: components/navbar.en.md
                - User menu: components/usermenu.en.md
                - Alert banner: components/alert.en.md
                - Bullet point list: components/bullet_point_list.en.md
                - Breadcrumbs: components/breadcrumbs.en.md
                - Card: components/card.en.md
                - Carousel: components/carousel.en.md
                - Chat: components/chat.en.md
                - Code block: components/code_block.en.md
                - Differentiator: components/differentiator.en.md
                - Footer: components/footer.en.md
                - Forms: components/form.en.md
                - Generic filter: components/generic_filter.en.md
                - Geo map: components/geo_map.en.md
                - Infinite Scroll: components/infinite_scroll.en.md
                - Links: components/links.en.md
                - Live content: components/live_content.en.md
                - Modal: components/modal.en.md
                - Pagination: components/pagination.en.md
                - Popover: components/popover.en.md
                - Progress bar: components/progressbar.en.md
                - Query builder: components/query_builder.en.md
                - Search bar: components/search_bar.en.md
                - Sidebar: components/sidebar.en.md
                - Step bar: components/step_bar.en.md
                - Table: components/table.en.md
                - Toggle view: components/toggle_view.en.md
                - Tooltip: components/tooltip.en.md
                - Input elements:
                    - Overview: components/inputs.en.md
                    - Button: components/input_elements/button.en.md
                    - Checkbox: components/input_elements/checkbox.en.md
                    - Dropdown: components/input_elements/dropdown.en.md
                    - Radio button: components/input_elements/radio_button.en.md
                    - Range slider: components/input_elements/range_slider.en.md
                    - Toggle button: components/input_elements/toggle_button.en.md
            - Template tags: template-tags.en.md
            - Base template: base_template.en.md
            - Guides:
                - Customisation: guides/customization.en.md
                - Accessibility: guides/accessibility.en.md
                - Internationalisation: guides/i18n.en.md
                - Styling: guides/styling.en.md
                - Icons: guides/icons.en.md
                - Phrases: guides/phrases.en.md
                - Naming conventions: guides/naming_conventions.en.md
            - API reference: api-reference.en.md
            - Contributing: contributing.en.md
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [insight_ui]
          options:
            show_source: true
            show_root_heading: true

nav:
  - Startseite: index.md
  - Installation: installation.md
  - Schnellstart: quickstart.md
  - Komponenten:
      - Überblick: components/index.md
      - Navbar: components/navbar.md
      - Benutzermenü: components/usermenu.md
      - Hinweisbanner: components/alert.md
      - Aufzählungsliste: components/bullet_point_list.md
      - Breadcrumbs: components/breadcrumbs.md
      - Karte: components/card.md
      - Karussell: components/carousel.md
      - Chat: components/chat.md
      - Code-Block: components/code_block.md
      - Differentiator: components/differentiator.md
      - Footer: components/footer.md
      - Formulare: components/form.md
      - Filter: components/generic_filter.md
      - Geo-Map: components/geo_map.md
      - Infinite Scroll: components/infinite_scroll.md
      - Links: components/links.md
      - Live-Content: components/live_content.md
      - Modal: components/modal.md
      - Pagination: components/pagination.md
      - Popover: components/popover.md
      - Fortschrittsbalken: components/progressbar.md
      - Query Builder: components/query_builder.md
      - Suchleiste: components/search_bar.md
      - Seitenleiste: components/sidebar.md
      - Schrittleiste: components/step_bar.md
      - Tabelle: components/table.md
      - Ansichten-Umschalter: components/toggle_view.md
      - Tooltip: components/tooltip.md
      - Eingabeelemente:
          - Übersicht: components/inputs.md
          - Button: components/input_elements/button.md
          - Checkbox: components/input_elements/checkbox.md
          - Dropdown: components/input_elements/dropdown.md
