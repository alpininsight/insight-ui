[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "insight-ui"
dynamic = ["version"]
description = "A modern, accessible UI framework for Django"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
    {name = "Insight UI Team"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

keywords = [
    "django",
    "ui",
    "components",
    "tailwind",
    "htmx",
    "accessibility",
    "wcag",
]
dependencies = [
    "django>=5.2.17,<7",
    "markdown>=3.10.3",
    "defusedxml>=0.7.1",
]

[tool.uv]
default-groups = ["dev"]

# For uv and poetry
[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "django-stubs==6.1.0",
    "ruff>=0.16.1",
    "pre-commit>=4.6.1",
    "django-tailwind-cli>=4.6.2",
]
pytest = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "pytest-cov==7.1.0",
    "beautifulsoup4>=4.15.0",
    "docstring-parser>=0.18.0",
    "pyyaml>=6.0.3",
]

# For pip
[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "pytest-cov==7.1.0",
    "beautifulsoup4>=4.15.0",
    "docstring-parser>=0.18.0",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://insight-ui.com"
Documentation = "https://insight-ui.com"
Repository = "https://github.com/alpininsight/insight-ui"
Issues = "https://github.com/alpininsight/insight-ui/issues"


[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
# Match tags like "v1.2.3" and write a version file for runtime
tag-pattern = "v(?P<version>.*)"
version-file = "insight_ui/_version.py"


[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true

[tool.coverage.run]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "insight_ui/_version.py",
]

[tool.ruff]
fix = true

src = ["insight_ui", "tests"]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".data",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "__pycache__",
    "_build",
    "_wt",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "staticfiles",
    "venv",
    "site",
    "htmlcov",
    "docs",
    "*/migrations/*.py"
]

# Same as Black.
line-length = 120
indent-width = 4

# Target minimum supported Python version
target-version = "py312"

[tool.ruff.lint]
select = [
    "I",        # isort
    "N",        # pep8-naming
    "C90",      # mccabe
    "F",        # Pyflakes
    "E",        # Pycodestyle (Errors)
    "W",        # Pycodestyle (Warnings)
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "ASYNC",    # flake8-async
    "S",        # flake8-bandit
    "BLE",      # flake8-blind-except
    "A",        # flake8-builtins
    "C4",       # flake8-comprehensions
    "DTZ",      # flake8-datetimez
    "T10",      # flake8-debugger
    "EXE",      # flake8-executable
    "ICN",      # flake8-import-conventions
    "G",        # flake8-logging-format
    "INP",      # flake8-no-pep420
    "PIE",      # flake8-pie
    "T20",      # flake8-print
    "PT",       # flake8-pytest-style
    "Q",        # flake8-quotes
    "RSE",      # flake8-raise
    "RET",      # flake8-return
    "SIM",      # flake8-simplify
    "ARG",      # flake8-unused-arguments
    "PTH",      # flake8-use-pathlib
    "TD",       # flake8-todos
    "PGH",      # pygrep-hooks
    "ERA",      # eradicate (commented-out-code)
    "PL",       # Pylint
    "TRY",      # tryceratops
    "PERF",     # Perflint
    "LOG",      # flake8-logging
    "RUF",      # Ruff-specific rules
    "D",        # pydocstyle
    "ANN",      # flake8-annotations
    "DJ",       # flake8-django
    "FURB",     # refurb (modern Python patterns)
    "TC",       # flake8-type-checking
    # "FBT",      # flake8-boolean-trap
]

ignore = [
  "ANN002",   # Missing type annotation for `*args`
  "ANN003",   # Missing type annotation for `**kwargs`
  "S113",     # (Bandit) Probable use of requests call without timeout
  "D203",     # one-blank-line-before-class (incompatible with D211)
  "D212",     # multi-line-summary-first-line (incompatible with D213)
  "D400",     # First line should end with a period (superseded by D415)
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"insight_ui/configs/**.py" = ["E501"]
"insight_ui/templatetags/insight_tags.py" = ["PLR0913", "PLR0917"]
# Test-specific ignores
"tests/**/*.py" = [
    "S101",    # assert is expected in tests
    "ARG001",  # Unused function arguments (fixtures)
    "F811",    # Redefinition of unused name (fixtures)
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Keep test(a, b)
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in docstrings.
# This only has an effect when the `docstring-code-format` setting is enabled.
docstring-code-line-length = "dynamic"

[tool.ruff.lint.isort]
combine-as-imports = true
split-on-trailing-comma = false


[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses  = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.hatch.build.targets.wheel]
packages = ["insight_ui"]

[tool.hatch.build.targets.sdist]
include = [
    "/insight_ui", "/tests", "/scripts", "/devtools", "/package.json", "/package-lock.json",
    "/pyproject.toml", "/pytest.ini", "/vitest.config.js", "/README.md", "/LICENSE",
    "/NOTICE", "/REUSE.toml", "/LICENSES",
]
exclude = ["*.min.js", "*.min.css", "__pycache__", "*.pyc"]
