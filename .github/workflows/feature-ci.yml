name: Contributor CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contributor-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Preserve the required status names without private workflow calls.
    name: Python/Django Quality / Quality (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Install locked public dependencies
        run: uv sync --locked --all-groups
      - name: Check exported requirements
        run: |
          uv export --no-emit-project --no-hashes --no-dev --format requirements.txt -o requirements.txt
          git diff --exit-code -- requirements.txt
      - name: Lint and format
        run: |
          uv run --no-sync ruff check --no-fix .
          uv run --no-sync ruff format --check .
      - name: Test supported Django series
        run: |
          for django in 'django~=5.2.0' 'django~=6.0.0' 'django~=6.1.0'; do
            uv pip install "$django"
            uv run --no-sync python -m django check --settings=tests.settings
            uv run --no-sync pytest
          done

  hygiene:
    name: Contributor hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'
          enable-cache: false
      - run: uv sync --locked --all-groups
      - name: Run public pre-commit hooks
        # Scan secrets once as a binary, not as a Go hook in every matrix leg.
        env:
          PRE_COMMIT_HOME: ${{ runner.temp }}/pre-commit
          SKIP: no-commit-to-branch
        run: |
          uv run --no-sync python - <<'PY'
          import os
          from pathlib import Path
          import yaml
          config = yaml.safe_load(Path('.pre-commit-config.yaml').read_text())
          config['repos'] = [repo for repo in config['repos'] if repo['repo'] != 'https://github.com/gitleaks/gitleaks']
          Path(os.environ['RUNNER_TEMP'], 'pre-commit.yaml').write_text(yaml.safe_dump(config))
          PY
          uv run --no-sync pre-commit run --all-files --config "$RUNNER_TEMP/pre-commit.yaml"

  javascript:
    name: JavaScript and static assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm run verify:static-build

  stylesheet:
    # The packaged tailwind.css is committed; a template change without a rebuild ships stale CSS.
    name: Compiled stylesheet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'
          enable-cache: false
      - run: uv sync --locked --all-groups
      - name: Rebuild tailwind.css with the pinned Tailwind CLI
        env:
          DJANGO_SETTINGS_MODULE: tests.tailwind_settings
        run: uv run --no-sync python -m django tailwind build --force --no-minify
      - name: Require the committed tailwind.css to match the rebuild
        run: |
          if ! git diff --exit-code --stat -- insight_ui/static/insight_ui/css/tailwind.css; then
            echo "::error file=insight_ui/static/insight_ui/css/tailwind.css::tailwind.css is out of date. Run 'npm run build:tailwind' and commit the result."
            exit 1
          fi

  browser:
    name: Compiled CSS and native download acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The image supplies the matching browser revision and system dependencies.
    # Keep the digest fixed so a tag update cannot change the acceptance runtime.
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.0-noble@sha256:684df257a1fa0ef3fa288239819984008f560e8f8db5b635ee9e2a50cbcd2e23
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'
          enable-cache: false
      - run: uv sync --locked --all-groups
      - name: Verify native downloads without page JavaScript
        run: uv run --no-sync --with playwright==1.64.0 python -m tests.browser.button_download_smoke
      - name: Verify compiled outline ink in both themes
        run: uv run --no-sync --with playwright==1.64.0 python -m tests.browser.outline_ink_smoke

  distribution:
    name: Wheel and sdist installation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'
          enable-cache: false
      - name: Build and inspect both distributions
        run: |
          uv build
          uv run --no-project python scripts/check_distribution.py
      - name: Test installed distributions outside the checkout
        run: uv run --no-project python scripts/smoke_distribution.py
      - name: Upload the tested package files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-dist-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        run: |
          curl --fail --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Scan changes and working tree
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ -n "$PR_BASE_SHA" ]]; then
            gitleaks git --redact --log-opts="$PR_BASE_SHA..$PR_HEAD_SHA" .
          else
            gitleaks git --redact .
          fi
          gitleaks dir --redact .

  quality_gate:
    name: Python/Django Quality / Quality Gate
    needs: [quality, hygiene, javascript, stylesheet, browser, distribution, gitleaks]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every contributor check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
