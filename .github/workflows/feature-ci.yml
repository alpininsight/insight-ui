name: Feature CI (quality checks)

on:
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, Django ${{ matrix.django-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        django-version: ["5.2", "6.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Sync environment
        run: uv sync --all-groups

      - name: Install Django ${{ matrix.django-version }}
        run: uv pip install "django~=${{ matrix.django-version }}.0"

      - name: Lint (ruff)
        if: matrix.django-version == '6.0'
        run: uv run ruff check .

      - name: Tests (pytest)
        run: uv run pytest

  required-test-3-12:
    name: test (3.12)
    runs-on: ubuntu-latest
    needs: test
    if: ${{ always() }}
    steps:
      - name: Mirror matrix success for branch protection
        run: test "${{ needs.test.result }}" = "success"

  required-test-3-13:
    name: test (3.13)
    runs-on: ubuntu-latest
    needs: test
    if: ${{ always() }}
    steps:
      - name: Mirror matrix success for branch protection
        run: test "${{ needs.test.result }}" = "success"

  required-test-3-14:
    name: test (3.14)
    runs-on: ubuntu-latest
    needs: test
    if: ${{ always() }}
    steps:
      - name: Mirror matrix success for branch protection
        run: test "${{ needs.test.result }}" = "success"
