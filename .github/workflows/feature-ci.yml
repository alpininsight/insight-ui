---
# =============================================================================
# Alpine Insight workflow contract
# Source:
#   - public template: alpininsight/.github/.github/workflow-templates/feature-ci.yml
#   - repository policy backend:
#     - alpininsight/.github-private/.github/workflows/repository-policy-reusable.yml@main
#   - quality backend:
#     - alpininsight/.github-private/.github/workflows/python-django-quality-reusable.yml@main
# Purpose:
#   - keeps repository policy centralized
#   - keeps Python/Django quality centralized
#   - preserves insight-ui's Django 5.2/6.1 compatibility checks inside the
#     central quality reusable because the reusable currently only matrices
#     Python versions, not Django versions.
# =============================================================================

name: Standard CI (Alpine Insight)

on:
  pull_request:
    branches: [develop, main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  push:
    branches: [develop, main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: read
    uses: alpininsight/.github-private/.github/workflows/repository-policy-reusable.yml@main

  quality:
    name: Python/Django Quality
    uses: alpininsight/.github-private/.github/workflows/python-django-quality-reusable.yml@main
    with:
      python_versions: '["3.12", "3.13", "3.14"]'
      uv_sync_args: --frozen --all-groups
      django_check_command: |
        uv export --no-emit-project --no-hashes --no-dev --format requirements.txt -o requirements.txt
        git diff --exit-code -- requirements.txt
        uv run python -m django check --settings=tests.settings
        uv build
        uv run python scripts/check_distribution.py
      test_command: |
        uv pip install "django~=5.2.0"
        uv run --no-sync pytest
        uv pip install "django~=6.1.0"
        uv run --no-sync pytest
    secrets:
      github_read_token: ${{ secrets.INSIGHT_TOKEN_RO }}
      ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
