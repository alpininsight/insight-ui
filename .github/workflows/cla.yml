---
# =============================================================================
# Repository-local by design.
#
# Every other workflow here is a thin caller into
# alpininsight/.github-private. This one is not, because its configuration is
# specific to this repository: the document URL, the signature branch and the
# signing phrase. When a second repository needs a CLA -- insight-ui-user and
# insight-ui-webgl carry different licences and may follow -- move the logic
# into a reusable workflow there and leave a caller behind, matching the rest.
# =============================================================================

name: CLA Assistant

on:
  # zizmor: ignore[dangerous-triggers] -- no checkout of PR code; the action only
  # reads PR metadata and comment bodies to record signatures.
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions: {}

jobs:
  cla:
    runs-on: ubuntu-latest
    # Only react to the signature phrase or to pull request events, not to every
    # comment in every issue.
    if: >-
      (github.event.issue.pull_request &&
       contains(github.event.comment.body, 'I hereby sign the CLA')) ||
      github.event_name == 'pull_request_target'
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/alpininsight/insight-ui/blob/develop/CLA.md
          branch: cla-signatures
          custom-notsigned-prcomment: >-
            Thanks for your pull request. Insight UI is dual-licensed
            (AGPL-3.0 and a commercial Enterprise licence), so we ask every
            contributor to sign the Contributor Licence Agreement once before a
            first merge. You keep the copyright in your work — see LICENSING.md
            for what the agreement does and does not grant.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you.
          # Bots only. Maintainers sign like everyone else; contributions made
          # in the course of employment are covered by Part B of the agreement,
          # signed once by the employer.
          allowlist: bot*,*[bot]
