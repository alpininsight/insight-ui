name: Main publish (PyPI)
on:
  release:
    types: [published]
jobs:
  build-and-publish:
    # Publication is a separate owner decision; a release must not opt in implicitly.
    if: vars.INSIGHT_UI_PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Build wheel & sdist
        run: |
          uv build
          uv run python scripts/check_distribution.py
          ls -lah dist/
      - name: Publish to PyPI
        if: success()
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish --index https://upload.pypi.org/legacy/
