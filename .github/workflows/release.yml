---
# =============================================================================
# Release Workflow - Auto-versioning with GitVersion
# Triggers on push to main branch, creates releases automatically
# =============================================================================
#
# How it works:
#   1. Merge PR to main
#   2. GitVersion calculates semantic version from commit history
#   3. If version tag doesn't exist, creates GitHub Release automatically
#
# Version bumping (via commit messages):
#   - feat: → minor version bump (0.1.0 → 0.2.0)
#   - fix:  → patch version bump (0.1.0 → 0.1.1)
#   - BREAKING CHANGE: → major version bump (0.1.0 → 1.0.0)
#
# =============================================================================

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5.2.0
        with:
          dotnet-version: '8.0.x'

      - name: Install GitVersion.Tool
        run: |
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          dotnet tool install --global GitVersion.Tool --version 5.*

      - name: Calculate version
        id: gitversion
        run: |
          set -euo pipefail
          dotnet-gitversion -config GitVersion.yml > gitversion.json
          cat gitversion.json
          python3 - <<'PY'
          import json
          import os

          with open("gitversion.json", encoding="utf-8") as fh:
              data = json.load(fh)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"major_minor_patch={data['MajorMinorPatch']}\n")
              fh.write(f"semver={data['SemVer']}\n")
              fh.write(f"full_semver={data['FullSemVer']}\n")
          PY

      - name: Display and validate version info
        id: version
        run: |
          VERSION="${{ steps.gitversion.outputs.major_minor_patch }}"
          echo "MajorMinorPatch: $VERSION"
          echo "SemVer: ${{ steps.gitversion.outputs.semver }}"
          echo "FullSemVer: ${{ steps.gitversion.outputs.full_semver }}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: '$VERSION'. Expected X.Y.Z"
            exit 1
          fi

          echo "version=$VERSION" >> "${GITHUB_OUTPUT}"

      - name: Check if tag exists
        id: tagcheck
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "Tag ${TAG} already exists, skipping release"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "Tag ${TAG} does not exist, will create release"
          fi

      - name: Create GitHub Release
        if: steps.tagcheck.outputs.exists != 'true'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Summary
        if: steps.tagcheck.outputs.exists != 'true'
        run: |
          echo "### Release v${{ steps.version.outputs.version }} created" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: v${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
