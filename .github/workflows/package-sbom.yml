---
# Thin caller only. Package SBOM logic lives in alpininsight/.github-private.
# Enterprise SBOM artifacts land in insight-ui-docs (not on this repo's GitHub Release).
# Tracks: alpininsight/insight-ui-docs#13
name: Package SBOM

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package-sbom:
    permissions:
      contents: read
    uses: alpininsight/.github-private/.github/workflows/reusable-package-sbom.yml@main
    with:
      setup_uv: true
      build_command: uv build
      working_directory: "."
      scan_glob: dist/*.whl
      release_tag: ${{ github.event.release.tag_name }}
      destination_repository: alpininsight/insight-ui-docs
      destination_ref: main
      upload_to_caller_release: false
    secrets:
      destination_bot_token: ${{ secrets.INSIGHT_UI_DOCS_BOT_TOKEN }}
