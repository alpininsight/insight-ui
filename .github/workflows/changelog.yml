---
# =============================================================================
# Changelog Workflow - Auto-generate CHANGELOG.md on develop
# Triggers on push to develop branch
# =============================================================================
name: Changelog

on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'CHANGELOG.md'  # Prevent infinite loop

  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install git-cliff
        uses: taiki-e/install-action@650c5ca14212efbbf3e580844b04bdccf68dac31  # v2.67.18
        with:
          tool: git-cliff@2.7.0

      - name: Generate changelog
        id: changelog
        run: |
          # Generate full changelog
          git-cliff --output CHANGELOG.md

          # Strip trailing whitespace (git-cliff templates may produce it)
          sed -i 's/[[:space:]]*$//' CHANGELOG.md

          # Check if changelog changed
          if git diff --quiet CHANGELOG.md; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changelog changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changelog updated"
          fi

      - name: Commit and push changelog
        if: steps.changelog.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md
          git commit -m "chore(changelog): update CHANGELOG.md [skip ci]"
          git push
