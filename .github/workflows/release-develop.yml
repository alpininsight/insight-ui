name: Release (develop)

on:
  push:
    branches: [ develop ]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-develop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.INSIGHT_TOKEN || secrets.GHRC_TOKEN || github.token }}
          release-type: simple
          target-branch: develop
          include-v-in-tag: true
          prerelease: true
          prerelease-type: dev
          bump-minor-pre-major: true
          bump-patch-for-minor-pre-major: false
