name: Django container build

on:
  pull_request:
    branches: [main, develop]
    types: [opened, reopened, synchronize, ready_for_review, edited]
    paths:
      - ".github/workflows/container-build.yml"
      - ".dockerignore"
      - ".env.example"
      - "Dockerfile"
      - "docker/**"
      - "core/**"
      - "insight_ui/**"
      - "manage.py"
      - "pyproject.toml"
      - "requirements.txt"
  push:
    branches: [develop, main]
    paths:
      - ".github/workflows/container-build.yml"
      - ".dockerignore"
      - ".env.example"
      - "Dockerfile"
      - "docker/**"
      - "core/**"
      - "insight_ui/**"
      - "manage.py"
      - "pyproject.toml"
      - "requirements.txt"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/insight-ui
  LOCAL_IMAGE_TAG: insight-ui:ci

concurrency:
  group: container-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ env.LOCAL_IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test Django management commands
        run: |
          docker run --rm -e RUN_MIGRATIONS=1 ${{ env.LOCAL_IMAGE_TAG }} true
          docker run --rm -e RUN_MIGRATIONS=0 -e RUN_COLLECTSTATIC=1 ${{ env.LOCAL_IMAGE_TAG }} true

      - name: Smoke test web container
        run: |
          set -euo pipefail

          docker run -d --name insight-ui-web -e RUN_MIGRATIONS=1 ${{ env.LOCAL_IMAGE_TAG }}
          trap 'docker logs insight-ui-web || true; docker rm -f insight-ui-web || true' EXIT

          for attempt in {1..30}; do
            if [ "$(docker inspect -f '{{.State.Running}}' insight-ui-web)" != "true" ]; then
              echo "Container exited before becoming ready"
              exit 1
            fi

            if docker exec insight-ui-web python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)" > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done

          echo "Container did not become ready in time"
          exit 1

  publish:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
