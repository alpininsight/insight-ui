name: Django container build

on:
  pull_request:
    branches: [main, develop]
    types: [opened, reopened, synchronize, ready_for_review, edited]
    paths:
      - ".github/workflows/container-build.yml"
      - ".dockerignore"
      - ".env.example"
      - "Dockerfile"
      - "docker/**"
      - "core/**"
      - "insight_ui/**"
      - "manage.py"
      - "pyproject.toml"
      - "requirements.txt"
  push:
    branches: [develop, main]
    paths:
      - ".github/workflows/container-build.yml"
      - ".dockerignore"
      - ".env.example"
      - "Dockerfile"
      - "docker/**"
      - "core/**"
      - "insight_ui/**"
      - "manage.py"
      - "pyproject.toml"
      - "requirements.txt"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/insight-ui
  LOCAL_IMAGE_TAG: insight-ui:ci

concurrency:
  group: container-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive build metadata
        id: build_meta
        run: |
          echo "artifact_version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
          echo "build_created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build image for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ env.LOCAL_IMAGE_TAG }}
          build-args: |
            ARTIFACT_VERSION=${{ steps.build_meta.outputs.artifact_version }}
            GIT_COMMIT_SHA=${{ github.sha }}
            BUILD_CREATED=${{ steps.build_meta.outputs.build_created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test Django management commands
        run: |
          docker run --rm -e RUN_MIGRATIONS=1 ${{ env.LOCAL_IMAGE_TAG }} true
          docker run --rm -e RUN_MIGRATIONS=0 -e RUN_COLLECTSTATIC=1 ${{ env.LOCAL_IMAGE_TAG }} true

      - name: Validate Django deploy profile
        run: |
          docker run --rm \
            -e RUN_MIGRATIONS=0 \
            -e SECURE_SSL_REDIRECT=1 \
            -e SESSION_COOKIE_SECURE=1 \
            -e CSRF_COOKIE_SECURE=1 \
            -e SECURE_HSTS_SECONDS=31536000 \
            -e SECURE_HSTS_INCLUDE_SUBDOMAINS=1 \
            -e SECURE_HSTS_PRELOAD=1 \
            ${{ env.LOCAL_IMAGE_TAG }} \
            python manage.py check --deploy --fail-level WARNING

      - name: Smoke test web container
        run: |
          set -euo pipefail

          docker run -d --name insight-ui-web \
            -e RUN_MIGRATIONS=1 \
            -e DEPLOYMENT_ENVIRONMENT=develop \
            -e DEPLOYMENT_LANE=develop \
            -e DEPLOYMENT_SLOT=green \
            ${{ env.LOCAL_IMAGE_TAG }}
          trap 'docker logs insight-ui-web || true; docker rm -f insight-ui-web || true' EXIT

          for attempt in {1..30}; do
            if [ "$(docker inspect -f '{{.State.Running}}' insight-ui-web)" != "true" ]; then
              echo "Container exited before becoming ready"
              exit 1
            fi

            if docker exec insight-ui-web python - <<'PY'
import json
import urllib.request

for endpoint in ("healthz", "readyz", "api/info"):
    with urllib.request.urlopen(f"http://127.0.0.1:8000/{endpoint}", timeout=2) as response:
        if response.status != 200:
            raise SystemExit(f"{endpoint} returned {response.status}")
        if endpoint == "api/info":
            payload = json.loads(response.read().decode())
            assert payload["service"]["name"] == "insight-ui"
            assert payload["deployment"]["environment"]["name"] == "develop"
            assert payload["deployment"]["lane"] == "develop"
            assert payload["deployment"]["slot"] == "green"
PY
            then
              exit 0
            fi
            sleep 2
          done

          echo "Container did not become ready in time"
          exit 1

  publish:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Derive build metadata
        id: build_meta
        run: |
          echo "artifact_version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
          echo "build_created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            ARTIFACT_VERSION=${{ steps.build_meta.outputs.artifact_version }}
            GIT_COMMIT_SHA=${{ github.sha }}
            BUILD_CREATED=${{ steps.build_meta.outputs.build_created }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
