---
# =============================================================================
# Alpine Insight workflow contract
# Source:
#   - private backend:
#     - alpininsight/.github-private/.github/workflows/python-django-container-build-reusable.yml@main
#     - alpininsight/.github-private/.github/workflows/image-digest-pin-bot-reusable.yml@main
# Purpose:
#   - validates the Django runtime contract on pull requests
#   - publishes develop images for the demo lane
#   - promotes the already tested tree digest on main without rebuilding
#   - opens GitOps digest-pin PRs for green/develop and blue/main slots
# Required repo secret:
#   - IMAGE_DIGEST_PIN_TOKEN writes digest-pin PRs to insight-lima-k8s-capi
# =============================================================================

name: Container Build (Alpine Insight)

on:
  pull_request:
    branches: [develop, main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
    paths:
      - ".github/workflows/container-build.yml"
      - ".dockerignore"
      - ".env.example"
      - "CHANGELOG.md"
      - "Dockerfile"
      - "docker/**"
      - "core/**"
      - "insight_ui/**"
      - "manage.py"
      - "pyproject.toml"
      - "requirements.txt"
      - "uv.lock"
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      publish_candidate:
        description: "Publish this branch as a temporary candidate image"
        required: false
        type: boolean
        default: false
      candidate_alias_tags:
        description: "Comma-separated candidate image aliases"
        required: false
        type: string
        default: "candidate-pr-250-theme"

concurrency:
  group: container-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  container_validate:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    uses: alpininsight/.github-private/.github/workflows/python-django-container-build-reusable.yml@main
    with:
      image_name: ghcr.io/${{ github.repository_owner }}/insight-ui
      service_name: insight-ui
      platform_namespace: demo
      public_base_url: https://insight-ui.demo.alpininsight.ai
      platforms: linux/amd64,linux/arm64
      local_image_tag: insight-ui:ci
      smoke_env_file: ""
      run_trivy_scan: true
      push: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_candidate }}
      candidate_alias_tags: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_alias_tags || 'candidate-pr-250-theme' }}
    secrets:
      github_read_token: ${{ secrets.INSIGHT_TOKEN_RO }}
      ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}

  container_release:
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: alpininsight/.github-private/.github/workflows/python-django-container-build-reusable.yml@main
    with:
      image_name: ghcr.io/${{ github.repository_owner }}/insight-ui
      service_name: insight-ui
      platform_namespace: demo
      public_base_url: https://insight-ui.demo.alpininsight.ai
      platforms: linux/amd64,linux/arm64
      local_image_tag: insight-ui:ci
      smoke_env_file: ""
      run_trivy_scan: true
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
      promote_existing_tree_digest: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets:
      github_read_token: ${{ secrets.INSIGHT_TOKEN_RO }}
      ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}

  pin_slot:
    name: Pin ${{ needs.container_release.outputs.slot }} slot digest
    needs: container_release
    if: >-
      github.event_name == 'push' &&
      needs.container_release.result == 'success' &&
      needs.container_release.outputs.published == 'true'
    permissions:
      contents: read
    uses: alpininsight/.github-private/.github/workflows/image-digest-pin-bot-reusable.yml@main
    with:
      consuming_repo: alpininsight/insight-lima-k8s-capi
      overlay_path: >-
        use-cases/management-cloud/demo/insight-ui/${{
        needs.container_release.outputs.slot }}/deployment.yaml
      image_name: ghcr.io/alpininsight/insight-ui
      image_digest: ${{ needs.container_release.outputs.image_digest }}
      slot: ${{ needs.container_release.outputs.slot }}
      lane: ${{ needs.container_release.outputs.lane }}
      app: insight-ui
      pr_automerge: true
    secrets:
      consuming_repo_token: ${{ secrets.IMAGE_DIGEST_PIN_TOKEN }}
