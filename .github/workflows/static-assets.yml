---
name: Static Assets

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-assets-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  static-assets-check:
    if: github.event_name == 'pull_request'
    uses: alpininsight/.github-private/.github/workflows/static-assets-reusable.yml@main
    with:
      mode: check
      setup_python: true
      setup_uv: true
      check_command: npm run check:static-build
      build_command: npm run build:static-all
      upload_cdn: false

  static-assets-cdn:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref_name == 'develop' || github.ref_name == 'main')
    uses: alpininsight/.github-private/.github/workflows/static-assets-reusable.yml@main
    with:
      mode: build
      setup_python: true
      setup_uv: true
      build_command: npm run build:static-all
      upload_cdn: true
      cdn_upload_immutable: false
      update_latest: false
      asset_directory: insight_ui/static/insight_ui
      cdn_prefix: insight-ui
      cdn_aliases: ${{ github.ref_name }}
      cdn_base_url: https://cdn.alpininsight.ai
      cdn_asset_globs: "*.js,*.css,*.svg,*.png,*.ico,*.webmanifest,*.ttf,*.woff,*.woff2,*.jpg,*.jpeg,*.webp,*.gif"
    secrets:
      r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
      r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      r2_endpoint: ${{ secrets.R2_ENDPOINT }}
