{% load static i18n %}

<!DOCTYPE html>
<html>
    <head>
        <script src="{% url 'javascript-catalog' %}"></script>

        <!-- HTMX CDN -->
        <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js" integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <script src="https://cdn.jsdelivr.net/npm/htmx-ext-ws@2.0.4" integrity="sha384-1RwI/nvUSrMRuNj7hX1+27J8XDdCoSLf0EjEyF69nacuWyiJYoQ/j39RT1mSnd2G" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

        {% if not component.allow_requests %}
            <!-- Demo Sandbox - blocks links, forms, and requests in demo iframes -->
            <script src="{% static 'insight_ui/js/insight-ui-demo-sandbox.js' %}"></script>
        {% endif %}

        <!-- prism (Syntax-Highlighting) and clipboard (Copy to clipboard) CDN -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.30.0/prism.min.js" integrity="sha512-HiD3V4nv8fcjtouznjT9TqDNDm1EXngV331YGbfVGeKUoH+OLkRTCMzA34ecjlgSQZpdHZupdSrqHY+Hz3l6uQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.30.0/plugins/autoloader/prism-autoloader.min.js" referrerpolicy="no-referrer"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.30.0/plugins/line-numbers/prism-line-numbers.min.js" integrity="sha512-BttltKXFyWnGZQcRWj6osIg7lbizJchuAMotOkdLxHxwt/Hyo+cl47bZU0QADg+Qt5DJwni3SbYGXeGMB5cBcw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <link rel="stylesheet" href="{% static 'insight_ui/css/prism.css' %}">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.30.0/plugins/line-numbers/prism-line-numbers.min.css" integrity="sha512-cbQXwDFK7lj2Fqfkuxbo5iD1dSbLlJGXGpfTDqbggqjHJeyzx88I3rfwjS38WJag/ihH7lzuGlGHpDBymLirZQ==" crossorigin="anonymous" referrerpolicy="no-referrer">

        <!-- leaflet (geo) -->
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous" referrerpolicy="no-referrer">

        <!-- Apache ECharts -->
        <script defer src="https://cdnjs.cloudflare.com/ajax/libs/echarts/6.0.0/echarts.min.js" integrity="sha512-4/g9GAdOdTpUP2mKClpKsEzaK7FQNgMjq+No0rX8XZlfrCGtbi4r+T/p5fnacsEC3zIAmHKLJUL7sh3/yVA4OQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

        <!-- Insight UI Modular Utils  -->
        <script defer src="{% static 'insight_ui/js/insight-ui-utils.js' %}"></script>

        <!-- Main stylesheet -->
        <link rel="stylesheet" href="{% static INSIGHT_UI.stylesheet %}">
    </head>
    <body class="bg-white dark:bg-gray-800 {% if not component.no_padding %}p-8{% endif %}">
        {% include "insight_ui/docs/component_demo.html" %}
    </body>

    <!-- Insight UI Modular JavaScript -->
    <script>
        window.JS_DEBUG = {{ INSIGHT_UI.JS_DEBUG|yesno:"true,false" }};
    </script>
    <script defer src="{% static 'insight_ui/js/insight-ui-debug.js' %}"></script>
    <script defer src="{% static 'insight_ui/js/insight-ui-utils.js' %}"></script>
    <script type="module" defer src="{% static 'insight_ui/js/insight-ui-3D-carousel.js' %}"></script>
    <script type="module" defer src="{% static 'insight_ui/js/insight-ui-accordion.js' %}"></script>
    <script type="module" defer src="{% static 'insight_ui/js/insight-ui-carousel.js' %}"></script>
    <script type="module" defer src="{% static 'insight_ui/js/insight-ui-checkbox.js' %}"></script>
    <script type="module" defer src="{% static 'insight_ui/js/insight-ui-code-block.js' %}"></script>
    <script type="module" defer src="{% static 'insight_ui/js/insight-ui-collapsible.js' %}"></script>
    <script type="module" defer src="{% static 'insight_ui/js/insight-ui-demo-container.js' %}"></script>
    <script type="module" defer src="{% static 'insight_ui/js/insight-ui-dropdown.js' %}"></script>
    <script type="module" defer src="{% static 'insight_ui/js/insight-ui-floater.js' %}"></script>
    <script type="module" defer src="{% static 'insight_ui/js/insight-ui-modal.js' %}"></script>
    <script type="module" defer src="{% static 'insight_ui/js/insight-ui-multiselect.js' %}"></script>
    <script type="module" defer src="{% static 'insight_ui/js/insight-ui-sidebar.js' %}"></script>
    <script type="module" defer src="{% static 'insight_ui/js/insight-ui-tabs.js' %}"></script>
    <script type="module" defer src="{% static 'insight_ui/js/insight-ui-theme-toggle.js' %}"></script>
    <script defer src="{% static 'insight_ui/js/insight-ui-websocket.js' %}"></script>
    <script type="module" defer src="{% static 'insight_ui/js/insight-ui-init.js' %}"></script>
    <!-- HTMX Extensions -->
    <script defer src="{% static 'insight_ui/js/insight-ui-htmx-extensions.js' %}"></script>
</html>
