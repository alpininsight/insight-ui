{% load static i18n insight_assets %}

<!DOCTYPE html>
<html>
    <head>
        {% url 'javascript-catalog' as javascript_catalog_url %}
        {% if javascript_catalog_url %}
            <script src="{{ javascript_catalog_url }}"></script>
        {% endif %}

        <!-- HTMX CDN -->
        <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js" integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <script src="https://cdn.jsdelivr.net/npm/htmx-ext-ws@2.0.4" integrity="sha384-1RwI/nvUSrMRuNj7hX1+27J8XDdCoSLf0EjEyF69nacuWyiJYoQ/j39RT1mSnd2G" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

        {% if not component.allow_requests %}
            <!-- Demo Sandbox - blocks links, forms, and requests in demo iframes -->
            <script src="{% insight_asset 'insight_ui/js/insight-ui-demo-sandbox.js' %}"></script>
        {% endif %}

        <!-- prism (Syntax-Highlighting) and clipboard (Copy to clipboard) CDN -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.30.0/prism.min.js" integrity="sha512-HiD3V4nv8fcjtouznjT9TqDNDm1EXngV331YGbfVGeKUoH+OLkRTCMzA34ecjlgSQZpdHZupdSrqHY+Hz3l6uQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.30.0/plugins/autoloader/prism-autoloader.min.js" referrerpolicy="no-referrer"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.30.0/plugins/line-numbers/prism-line-numbers.min.js" integrity="sha512-BttltKXFyWnGZQcRWj6osIg7lbizJchuAMotOkdLxHxwt/Hyo+cl47bZU0QADg+Qt5DJwni3SbYGXeGMB5cBcw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <link rel="stylesheet" href="{% insight_asset 'insight_ui/css/prism.css' %}">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.30.0/plugins/line-numbers/prism-line-numbers.min.css" integrity="sha512-cbQXwDFK7lj2Fqfkuxbo5iD1dSbLlJGXGpfTDqbggqjHJeyzx88I3rfwjS38WJag/ihH7lzuGlGHpDBymLirZQ==" crossorigin="anonymous" referrerpolicy="no-referrer">

        <!-- leaflet (geo) -->
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous" referrerpolicy="no-referrer">

        <!-- Apache ECharts -->
        <script defer src="https://cdnjs.cloudflare.com/ajax/libs/echarts/6.1.0/echarts.min.js" integrity="sha512-Uyq/AgtqFM4vT+unIGTDr4wMJDTUK9O5w2PXMQeBCSR8koqHpVz+qBmcQ+9Oeo5H+EmvT4pp/5QrsqhIbyjHTQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

        <!-- Main stylesheet -->
        <link rel="stylesheet" href="{% insight_asset INSIGHT_UI.stylesheet %}">
    </head>
    <body class="bg-insight-bg-base {% if not component.no_padding %}p-8{% endif %}">
        {% include "insight_ui/docs/component_demo.html" %}
    </body>

    <!-- Insight UI JavaScript -->
    <script>
        window.JS_DEBUG = {{ INSIGHT_UI.JS_DEBUG|yesno:"true,false" }};
    </script>
    <script defer src="{% insight_asset 'insight_ui/js/insight-ui-debug.js' %}"></script>
    <script defer src="{% insight_asset 'insight_ui/js/insight-ui-utils.js' %}"></script>
    <script defer src="{% insight_asset 'insight_ui/js/insight-ui-websocket.js' %}"></script>
    <script type="module" defer src="{% insight_asset 'insight_ui/js/insight-ui-init.js' %}"></script>
</html>
