{% load insight_tags %}

{% for component, demo in components %}
    <section data-insight-demo-container="{{ demo.id }}" class="component-container">
        <div class="w-full bg-insight-tertiary-background rounded-t-insight-surface p-4 py-2 md:px-6 md:py-3">
            <h2 class="text-xl pb-0">
                <a
                    href="{% url 'component_detail_page_view' component.value %}"
                    hx-get="{% url 'component_detail_page_view' component.value %}"
                    hx-target="#content"
                    hx-swap="innerHTML show:window:top"
                    hx-push-url="true"
                    class="inline-flex items-center gap-1 text-link"
                >
                    {{ component.formatted_name }} {% icon name="arrow-top-right-on-square" size="s" %}
                </a>
            </h2>
        </div>
        <div class="bg-insight-primary-background w-full rounded-b-insight-surface overflow-hidden">
            <iframe data-insight-demo-iframe="{{ demo.id }}" id="{{ demo.id }}" src="{{ demo.url }}" title="{{ demo.title }}" class="w-full mx-auto"></iframe>
        </div>
    </section>
{% endfor %}
