{% load i18n %}

<div
  {% if tag_id %}id="{{ tag_id }}"{% endif %}
  data-insight-websocket
  data-insight-stream-mode="htmx-ws-html"
  hx-ext="ws"
  ws-connect="{{ url }}"
>
  <div
    {% if tag_id %}id="{{ tag_id }}-output"{% endif %}
    data-insight-websocket-output
    class="insight-surface-soft insight-radius-surface insight-shadow-control px-4 py-2 mt-4"
  >
    {% if initial_content %}
      {{ initial_content|safe }}
    {% else %}
      <p class="text-secondary">{% trans "Wait for messages..." %}</p>
    {% endif %}
  </div>
  <span class="block text-sm text-primary mt-4">
    {% trans "Status:" %}
    <span
      {% if tag_id %}id="{{ tag_id }}-status"{% endif %}
      data-insight-websocket-status
      role="status"
      aria-live="polite"
    >
      <b>{% trans "Establishing connection..." %}</b>
    </span>
  </span>
  <span class="block text-xs text-secondary mt-2">
    {% trans "URL:" %} {{ url }}
  </span>
  <span class="block text-xs text-secondary">
    {% trans "Mode: HTMX WebSocket Extension (expects HTML)" %}
  </span>
</div>
