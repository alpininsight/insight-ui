{% load i18n %}

<div
  {% if tag_id %}id="{{ tag_id }}"{% endif %}
  hx-ext="ws"
  ws-connect="{{ url }}"
>
  <div id="{{ tag_id }}-output" class="bg-gray-100 dark:bg-gray-900 rounded shadow px-4 py-2 mt-4">
    {% if initial_content %}
      {{ initial_content|safe }}
    {% else %}
      <p class="text-secondary">{% trans "Wait for messages..." %}</p>
    {% endif %}
  </div>
  <span class="block text-sm text-primary mt-4">
    {% trans "Status:" %} <span id="{{ tag_id }}-status"><b>{% trans "Establishing connection..." %}</b></span>
  </span>
  <span class="block text-xs text-secondary mt-2">
    {% trans "URL:" %} {{ url }}
  </span>
  <span class="block text-xs text-secondary">
    {% trans "Mode: HTMX WebSocket Extension (expects HTML)" %}
  </span>
</div>
