{% load i18n %}

<div class="bg-white dark:bg-gray-900 rounded-sm">
    <table class="table-auto w-full">
        <thead class="text-primary">
            <tr class="border-b border-gray-400 dark:border-gray-600">
                <th class="text-start text-sm px-4 py-2" scope="col">{% trans "Name" %}</th>
                <th class="text-start text-sm px-4 py-2" scope="col">{% trans "Typ" %}</th>
                <th class="text-start text-sm px-4 py-2" scope="col">{% trans "Beschreibung" %}</th>
                <th class="text-start text-sm px-4 py-2" scope="col">{% trans "Standardwert" %}</th>
            </tr>
        </thead>
        <tbody class="text-primary">
            {% for row in rows %}
                <tr class="border-b border-gray-200 dark:border-gray-800">
                    <td class="text-start text-sm px-4 py-3"><span class="inline-tag">{{ row.0 }}</span></td>
                    <td class="text-start text-sm px-4 py-3"><i>{{ row.1 }}</i></td>
                    <td class="text-start text-sm px-4 py-3">{{ row.2|safe }}</td>
                    <td class="text-start text-sm px-4 py-3"><b>{{ row.3 }}</b></td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
