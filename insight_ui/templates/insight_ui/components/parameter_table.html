{% load i18n %}

<div class="bg-white dark:bg-gray-900 rounded-sm">
    <table class="table-auto w-full">
        <thead class="text-primary">
            <tr class="border-b border-gray-300 dark:border-gray-700">
                <th class="text-start text-sm px-4 py-2" scope="col">{% trans "Name" %}</th>
                <th class="text-start text-sm px-4 py-2" scope="col">{% trans "Type" %}</th>
                <th class="text-start text-sm px-4 py-2" scope="col">{% trans "Description" %}</th>
                <th class="text-start text-sm px-4 py-2" scope="col">{% trans "Default value" %}</th>
            </tr>
        </thead>
        <tbody class="text-primary">
            {% for row in rows %}
                <tr class="odd:bg-gray-100 even:bg-white odd:dark:bg-gray-800 even:dark:bg-gray-900">
                    <td class="text-start text-sm px-4 py-3"><span class="inline-tag">{{ row.name }}</span></td>
                    <td class="text-start text-sm px-4 py-3"><i>{{ row.type }}</i></td>
                    <td class="text-start text-sm px-4 py-3">{{ row.description|safe }}</td>
                    <td class="text-start text-sm px-4 py-3"><b>{{ row.default }}</b></td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
