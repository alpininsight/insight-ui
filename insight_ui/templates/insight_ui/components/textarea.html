{% load i18n insight_tags %}

<div class="flex flex-col w-full">
    <label for={{ textarea_config.name }} class="flex gap-1 mb-1 font-bold text-sm text-insight-headline">
        {% if textarea_config.icon %}
            {% icon textarea_config.icon %}
        {% endif %}
        <span class="self-end">{{ textarea_config.label }}</span>
        {% if textarea_config.required %}<span class="text-insight-danger-text" aria-hidden="true">*</span>{% endif %}
        {% if textarea_config.explanation %}
            <span class="text-insight-body" data-insight-tooltip="{{ textarea_config.explanation }}" data-position="top">
                {% icon name="question-mark-circle" size="xs" %}
            </span>
        {% endif %}
    </label>
    <textarea
        type="textarea"
        {% if textarea_config.tag_id %}id="{{ textarea_config.tag_id }}"{% endif %}
        {% if textarea_config.name %}name="{{ textarea_config.name }}"{% endif %}
        {% if textarea_config.placeholder %}placeholder="{{ textarea_config.placeholder }}"{% endif %}
        {% if textarea_config.rows %}rows="{{ textarea_config.rows }}"{% endif %}
        {% if textarea_config.cols %}cols="{{ textarea_config.cols }}"{% endif %}
        {% if textarea_config.required %}required{% endif %}
        {% if textarea_config.disabled %}disabled{% endif %}
        {% if textarea_config.disabled and textarea_config.disabled_reason %}data-insight-tooltip="{{ textarea_config.disabled_reason }}"{% endif %}
        {% data_attributes textarea_config.data_attrs %}
        class="input w-full"
    >{{ textarea_config.value|default:"" }}</textarea>
</div>
