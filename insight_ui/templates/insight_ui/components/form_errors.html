{% load i18n insight_tags %}

<div class="insight-form-status insight-form-status-error">
    <div class="flex">
        <div class="shrink-0 insight-form-status-icon-error">
            {% icon name="x-mark" size="xs" %}
        </div>
        <div class="ml-3">
            <h3 class="text-sm font-medium insight-form-status-title-error">
                {% trans 'Error while submitting the form' %}
            </h3>
            <div class="mt-2 text-sm insight-form-status-body-error">
                <ul class="list-disc pl-5 space-y-1">
                    {% for field, error in errors.items %}
                        <li>{{ error }}</li>
                    {% endfor %}
                </ul>
            </div>
            <div class="mt-4">
                <div class="-mx-2 -my-1.5 flex">
                    {% button label=_("Close") type="danger" size="s" outline=True data_insight_dismiss="form-errors" %}
                </div>
            </div>
        </div>
    </div>
</div>
