{% load i18n insight_tags %}

<div class="border border-insight-danger/30 bg-insight-danger/10 insight-radius-surface p-4">
    <div class="flex">
        <div class="shrink-0 text-insight-danger">
            {% icon name="x-mark" size="xs" %}
        </div>
        <div class="ml-3">
            <h3 class="text-sm font-medium text-insight-danger">
                {% trans 'Error while submitting the form' %}
            </h3>
            <div class="mt-2 text-sm text-insight-danger">
                <ul class="list-disc pl-5 space-y-1">
                    {% for field, error in errors.items %}
                        <li>{{ error }}</li>
                    {% endfor %}
                </ul>
            </div>
            <div class="mt-4">
                <div class="-mx-2 -my-1.5 flex">
                    <button type="button" class="bg-insight-danger/10 px-2 py-1.5 insight-radius-surface text-sm font-medium text-insight-danger hover:bg-insight-danger/20 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-insight-danger"
                            data-insight-dismiss="form-errors">
                        {% trans 'Close' %}
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
