{% load i18n insight_tags %}

<div class="flex flex-col w-full">
    <label for="{{ select_config.tag_id }}" class="flex gap-1 mb-1 font-bold text-sm text-primary">
        {% if select_config.icon %}
            {% icon select_config.icon %}
        {% endif %}
        <span class="self-end">{{ select_config.label }}</span>
        {% if select_config.required %}<span class="text-insight-danger" aria-label="{% trans 'Required' %}">*</span>{% endif %}
        {% if select_config.explanation %}
            <div class="text-secondary" data-insight-tooltip="{{ select_config.explanation }}" data-position="top">
                {% icon name="question-mark" size="xs" %}
            </div>
        {% endif %}
    </label>
    <select
        {% if select_config.tag_id %}id="{{ select_config.tag_id }}"{% endif %}
        {% if select_config.name %}name="{{ select_config.name }}"{% endif %}
        class="input w-full"
    >
        {% for option, text in select_config.options.items %}
            <option
                value="{{ option }}" {% if option == select_config.selected_option %}selected{% endif %}
                {% if option == "-" %}disabled{% elif option == "placeholder" %}class="text-secondary"{% endif %}
            >
                {{ text }}
            </option>
        {% endfor %}
    </select>
</div>
