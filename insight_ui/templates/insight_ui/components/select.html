{% load i18n insight_tags %}

<div class="flex flex-col w-full">
    <label for="{{ select_config.field_id }}" class="flex gap-1 mb-1 font-bold text-sm text-insight-headline">
        {% if select_config.icon %}
            {% icon select_config.icon %}
        {% endif %}
        <span class="self-end">{{ select_config.label }}</span>
        {% if select_config.required %}<span class="text-insight-danger-text" aria-hidden="true">*</span>{% endif %}
    </label>
    <select
        id="{{ select_config.field_id }}"
        name="{{ select_config.name }}"
        {% if select_config.required %}required{% endif %}
        {% if select_config.disabled %}disabled{% endif %}
        {% data_attributes select_config.data_attrs %}
        {% include "insight_ui/components/_form_field_aria.html" with field_id=select_config.field_id help_text=select_config.help_text error_text=select_config.error_text disabled=select_config.disabled disabled_reason=select_config.disabled_reason %}
        class="input w-full"
    >
        {% for option, text in select_config.options.items %}
            <option
                {# The placeholder submits an empty value, so a required select counts as unanswered. #}
                value="{% if option != 'placeholder' %}{{ option }}{% endif %}" {% if option == select_config.selected_option %}selected{% endif %}
                {% if option == "-" %}disabled{% elif option == "placeholder" %}class="text-insight-body"{% endif %}
            >
                {{ text }}
            </option>
        {% endfor %}
    </select>
    {% include "insight_ui/components/_form_field_messages.html" with field_id=select_config.field_id help_text=select_config.help_text error_text=select_config.error_text disabled=select_config.disabled disabled_reason=select_config.disabled_reason %}
</div>
