{% load insight_tags %}

<form
    role="search"
    {% if generic_filter_config.htmx_config %}
        {% htmx_attributes generic_filter_config.htmx_config request_url=generic_filter_config.request_url trigger="submit, change" push_url=True %}
    {% else %}
        action="{{ generic_filter_config.request_url }}"
        method="get"
    {% endif %}
    class="w-full"
>
    <!-- Filters -->
    <div class="flex flex-col {% if not generic_filter_config.vertical %}lg:flex-row{% endif %} gap-2 space-y-4">
        {% for filter in generic_filter_config.filters %}
            {% select config=filter %}
        {% endfor %}
    </div>
</form>
