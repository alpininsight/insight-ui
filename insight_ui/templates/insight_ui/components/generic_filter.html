{% load insight_tags %}

<form
    {% if htmx %}
        hx-get="{{ request_url }}"
        hx-target="{{ htmx.target }}"
        hx-swap="{{ htmx.swap|default:'innerHTML' }}"
        hx-push-url="{{ htmx.push_url|default:"true" }}"
        hx-indicator="{{ htmx.loading_indicator_id|default:'#loading-indicator' }}"
        hx-trigger="submit, change"
    {% else %}
        action="{{ request_url }}"
        method="get"
    {% endif %}
    class="w-full"
>
    <!-- Filters -->
    <div class="flex flex-col {% if not vertical %}lg:flex-row{% endif %} gap-2 space-y-4">
        {% for filter in filters %}
            {% select config=filter %}
        {% endfor %}
    </div>
</form>
