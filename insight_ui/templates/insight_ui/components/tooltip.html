<span id="{{ tag_id }}" class="bg-white dark:bg-gray-600 px-3 py-1 border border-gray-300 dark:border-0 insight-radius-overlay insight-shadow-subtle" role="tooltip">
    {% if show_arrow %}
        <!-- Arrow -->
        <div class="tooltip-arrow absolute left-1/2 -top-2 -translate-x-1/2 w-0 h-0 border-10 border-t-0 border-transparent border-b-white dark:border-b-gray-600"></div>
    {% endif %}
    {{ text }}
</span>
