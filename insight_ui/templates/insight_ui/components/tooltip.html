<span id="{{ tag_id }}" class="insight-surface-base px-3 py-1 border insight-border-surface insight-radius-control insight-shadow-control" role="tooltip">
    {% if show_arrow %}
        <!-- Arrow -->
        <div class="tooltip-arrow absolute left-1/2 -top-2 -translate-x-1/2 w-0 h-0 border-10 border-t-0 border-transparent border-b-white dark:border-b-gray-600"></div>
    {% endif %}
    {{ text }}
</span>
