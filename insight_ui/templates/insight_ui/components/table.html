{% load i18n %}

<div class="bg-white dark:bg-gray-800 rounded overflow-y-scroll">
  <table class="table-auto w-full">
    {% if caption %}
      <caption class="text-xs text-secondary">{{ caption }}</caption>
    {% endif %}

    {% if headers %}
      <thead class="text-primary">
        <tr class="border-b border-gray-400 dark:border-gray-500">
          {% for header in headers %}
            <th class="text-start text-xs px-4 py-2" scope="col">{{ header }}</th>
          {% endfor %}
        </tr>
      </thead>
    {% endif %}

    <tbody class="text-primary">
      {% for row in rows %}
        <tr class="border-b border-gray-200 dark:border-gray-600">
          {% for cell in row %}
            <td class="text-start text-xs px-4 py-3">{{ cell|safe }}</td>
          {% endfor %}
        </tr>
      {% empty %}
        <tfoot>
          <tr>
            <td colspan="{{ headers|length }}" class="w-full border-t border-gray-400 dark:border-gray-500 text-secondary text-center pt-16">
              {{ empty_msg }}
            </td>
          </tr>
        </tfoot>
      {% endfor %}
    </tbody>
  </table>
</div>
