{% load insight_tags %}

<div role="{% if info_config.severity == 'error' %}alert{% else %}note{% endif %}" class="px-4 py-1 text-base text-insight-headline bg-insight-surface border border-insight-border-raised border-s-4 rounded-e-insight-control {% if info_config.severity == 'success' %}border-s-insight-success{% elif info_config.severity == 'warning' %}border-s-insight-warning{% elif info_config.severity == 'error' %}border-s-insight-danger{% else %}border-s-insight-info{% endif %}">
    <span class="block font-bold text-lg italic {% if info_config.severity == 'success' %}text-insight-success{% elif info_config.severity == 'warning' %}text-insight-warning{% elif info_config.severity == 'error' %}text-insight-danger{% else %}text-insight-info{% endif %}">
        {{ info_config.severity|default:"Info"|upper }}:
    </span>
    {{ info_config.message|markdownify }}
</div>
