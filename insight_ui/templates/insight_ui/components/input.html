{% load i18n insight_tags %}

<div class="flex flex-col w-full">
    <label for={{ tag_id }} class="flex gap-1 text-sm font-bold text-primary mb-1">
        {% if icon %}
            {% icon icon %}
        {% endif %}
        <span class="self-end">{{ label }}</span>
        {% if required %}<span class="text-red-500" aria-label="{% trans 'Required' %}">*</span>{% endif %}
        {% if explanation %}
            <svg class="size-3 text-secondary" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" data-tooltip="{{ tooltip }}" data-position="top">
                <path fill-rule="evenodd" d="M2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10S2 17.523 2 12Zm9.008-3.018a1.502 1.502 0 0 1 2.522 1.159v.024a1.44 1.44 0 0 1-1.493 1.418 1 1 0 0 0-1.037.999V14a1 1 0 1 0 2 0v-.539a3.44 3.44 0 0 0 2.529-3.256 3.502 3.502 0 0 0-7-.255 1 1 0 0 0 2 .076c.014-.398.187-.774.48-1.044Zm.982 7.026a1 1 0 1 0 0 2H12a1 1 0 1 0 0-2h-.01Z" clip-rule="evenodd"/>
            </svg>
        {% endif %}
    </label>
    <input
        type="{{ input_type }}"
        {% if tag_id %}id="{{ tag_id }}"{% endif %}
        {% if name %}name="{{ name }}"{% endif %}
        {% if placeholder %}placeholder="{{ placeholder }}"{% endif %}
        {% if value %}value="{{ value }}"{% endif %}
        {% if minimum %}min="{{ minimum }}"{% endif %}
        {% if maximum %}max="{{ maximum }}"{% endif %}
        {% if min_length %}minlength="{{ min_length }}"{% endif %}
        {% if max_length %}maxlength="{{ max_length }}"{% endif %}
        {% if checked %}checked{% endif %}
        {% if required %}required{% endif %}
        {% if disabled %}disabled{% endif %}
        class="input w-full"
    >
</div>
