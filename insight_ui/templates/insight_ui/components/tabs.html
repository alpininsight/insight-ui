{% load i18n insight_tags %}

<div
  id="{{ config.id }}"
  role="tablist"
  aria-label="{{ config.label }}"
  class="flex border-b border-gray-200"
>
  {% for tab in config.tabs %}
    <button
      id="{{ tab.id }}"
      role="tab"
      aria-controls="panel-{{ forloop.counter }}"
      hx-get="{{ tab.url }}"
      hx-target="#tab-content"
      hx-swap="innerHTML"
      class="px-4 py-2 -mb-px border-b border-gray-200 font-semibold text-primary hover:border-insight-primary-hover hover:text-insight-primary-hover focus:outline-none focus:border-insight-primary-active focus:text-insight-primary-active transition-colors duration-300"
    >
      {% if tab.icon %}
        {% icon tab.icon %}
      {% endif %}
      {{ tab.title }}
    </button>
  {% endfor %}
</div>
<div
  id="tab-content"
  role="tabpanel"
  aria-labelledby="{% trans 'Tab content' %}"
>
  <!-- Content -->
</div>

<script>
  const tabs = document.querySelectorAll('[role="tab"]');
  const tabContent = document.getElementById('tab-content');

  document.body.addEventListener('htmx:afterSwap', (event) => {
    if(event.detail.target.id === 'tab-content'){
      tabContent.focus();
    }
  });

  tabs.forEach((tab, index) => {
    tab.addEventListener('keydown', (e) => {
      let newIndex = null;
      if (e.key === 'ArrowRight') {
        newIndex = (index + 1) % tabs.length;
      } else if (e.key === 'ArrowLeft') {
        newIndex = (index - 1 + tabs.length) % tabs.length;
      } else if (e.key === 'Home') {
        newIndex = 0;
      } else if (e.key === 'End') {
        newIndex = tabs.length - 1;
      }

      if (newIndex !== null) {
        e.preventDefault();
        tabs[newIndex].focus();
      }
    });

    tab.addEventListener('click', () => {
      activateTab(tab);
    });
  });

  function activateTab(selectedTab) {
    tabs.forEach(tab => {
      if (tab === selectedTab) {
        tab.setAttribute('aria-selected', 'true');
        tab.classList.remove('border-gray-300', 'text-primary', 'border-b');
        tab.classList.add('border-insight-primary', 'text-insight-primary', 'border-b-3');
        tabContent.setAttribute('aria-labelledby', tab.id);
      } else {
        tab.setAttribute('aria-selected', 'false');
        tab.classList.remove('border-insight-primary', 'text-insight-primary', 'border-b-3');
        tab.classList.add('border-gray-300', 'text-primary', 'border-b');
      }
    });
  }
</script>
