<div id="{{ chart_config.tag_id }}" style="height: {{ chart_config.chart_height|default:24 }}rem"></div>

<script type="module">
    var chartDom = document.getElementById("{{ chart_config.tag_id }}");
    var myChart = echarts.init(chartDom);
    var option;

    const rawData = {{ chart_config.dataset.data }};
    const series = {{ chart_config.dataset.series|safe }}.map((name, sid) => {
        return {
            name,
            type: 'line',
            stack: 'total',
            data: rawData[sid]
        };
    });

    option = {
        title: {
            text: "{{ chart_config.dataset.title }}"
        },
        tooltip: {
            trigger: 'axis'
        },
        legend: {
            data: {{ chart_config.dataset.series|safe }}
        },
        grid: {
            left: '3%',
            right: '4%',
            bottom: '15%',
            containLabel: true
        },
        xAxis: {
            type: 'category',
            boundaryGap: false,
            data: {{ chart_config.dataset.x_axis_legend|safe }}
        },
        yAxis: {
            type: 'value'
        },
        series
    };

    option && myChart.setOption(option);
</script>
