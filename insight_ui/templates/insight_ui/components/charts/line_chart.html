{% load i18n %}

{% include "insight_ui/components/charts/_data_table.html" %}

<div
    id="{{ chart_config.tag_id }}"
    style="height: {{ chart_config.chart_height|default:24 }}rem"
    role="img"
    aria-label="{% if chart_config.aria_label %}{{ chart_config.aria_label }}{% else %}{% blocktrans with title=chart_config.dataset.title %}Line chart: {{ title }}{% endblocktrans %}{% endif %}"
    aria-describedby="{{ chart_config.tag_id }}-table"
></div>

<script type="module">
    var chartDom = document.getElementById("{{ chart_config.tag_id }}");
    var myChart = echarts.init(chartDom);
    var option;

    const rawData = {{ chart_config.dataset.data }};
    const series = {{ chart_config.dataset.series|safe }}.map((name, sid) => {
        return {
            name,
            type: 'line',
            stack: 'total',
            data: rawData[sid]
        };
    });

    option = {
        aria: {
            enabled: true,
            decal: {
                show: {{ chart_config.show_decal|yesno:"true,false" }}
            }
        },
        title: {
            text: "{{ chart_config.dataset.title }}"
        },
        tooltip: {
            trigger: 'axis'
        },
        legend: {
            data: {{ chart_config.dataset.series|safe }}
        },
        grid: {
            left: '3%',
            right: '4%',
            bottom: '15%',
            containLabel: true
        },
        xAxis: {
            type: 'category',
            boundaryGap: false,
            data: {{ chart_config.dataset.x_axis_legend|safe }}
        },
        yAxis: {
            type: 'value'
        },
        series
    };

    option && myChart.setOption(option);

    const resizeChart = () => myChart.resize();
    window.addEventListener('resize', resizeChart);
    if ('ResizeObserver' in window) {
        const resizeObserver = new ResizeObserver(resizeChart);
        resizeObserver.observe(chartDom);
    }
</script>
