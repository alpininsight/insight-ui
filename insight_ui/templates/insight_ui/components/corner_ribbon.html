{% load i18n %}

{% if position == "top-left" %}
  <div class="fixed ltr:-left-16 rtl:-right-16 top-8 w-64 z-50 pointer-events-none">
    <div class="py-2 text-center bg-insight-{{ color }} text-white font-bold shadow-lg transform-[rotate(-45deg)] opacity-85"
         {% if tag_id %}id="{{ tag_id }}"{% endif %}
    >
      {{ text }}
    </div>
  </div>
{% elif position == "bottom-right" %}
  <div class="fixed ltr:-right-16 rtl:-left-16 bottom-8 w-64 z-50 pointer-events-none">
    <div class="py-2 text-center bg-insight-{{ color }} text-white font-bold shadow-lg transform-[rotate(-45deg)] opacity-85"
         {% if tag_id %}id="{{ tag_id }}"{% endif %}
    >
      {{ text }}
    </div>
  </div>
{% elif position == "bottom-left" %}
  <div class="fixed ltr:-left-16 rtl:-right-16 bottom-8 w-64 z-50 pointer-events-none">
    <div class="py-2 text-center bg-insight-{{ color }} text-white font-bold shadow-lg transform-[rotate(45deg)] opacity-85"
         {% if tag_id %}id="{{ tag_id }}"{% endif %}
    >
      {{ text }}
    </div>
  </div>
{% else %}
  <div class="fixed ltr:-right-24 rtl:-left-24 top-16 w-96 z-50 pointer-events-none">
    <div class="py-4 text-center bg-insight-{{ color }} text-white font-bold shadow-lg transform-[rotate(45deg)] opacity-85"
         {% if tag_id %}id="{{ tag_id }}"{% endif %}
    >
      {{ text }}
    </div>
  </div>
{% endif %}
