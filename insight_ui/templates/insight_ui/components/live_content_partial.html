{% load i18n insight_tags %}

<div class="bg-insight-bg-surface border border-insight-border-surface rounded-insight-surface p-4">
    <div class="flex items-center">
        <div class="shrink-0">
            {% icon name="clock" %}
        </div>
        <div class="ms-3">
            <p class="text-sm text-insight-text-primary">
                {{ data.message }}
            </p>
            <p class="text-xs text-insight-text-secondary mt-1">
                {% trans "Status" %}: {{ data.status }} | {% trans "Timestamp" %}: {{ timestamp }}
            </p>
        </div>
    </div>
</div>
