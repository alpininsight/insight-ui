{% load static i18n %}

<div
    class="flex h-full w-full flex-col overflow-hidden rounded border border-gray-200 bg-white shadow-sm dark:border-gray-600 dark:bg-gray-800"
>
    <img class="h-56 w-full bg-gray-100 object-cover dark:bg-gray-700" src="{{ image.url }}" alt="{{ image.alt }}">

    <!-- Title and description -->
    <div class="flex flex-1 flex-col px-4 py-3">
        {% if url %}
            <a href="{% url url %}">
                <p id="card-title" class="text-primary font-bold text-xl hover:text-insight-text-link-hover mb-2">{{ title }}</p>
            </a>
        {% else %}
            <p id="card-title" class="text-primary font-bold text-xl mb-2">{{ title }}</p>
        {% endif %}
        <p id="card-description" class="text-secondary text-sm leading-relaxed hyphens-auto" lang="de">{{ content }}</p>
    </div>

    <!-- Tags -->
    {% if tags %}
        <div id="card-tags" class="flex flex-wrap gap-1 px-4 pb-2">
            {% for tag in tags %}
                <button class="btn btn-subtil btn-xs">
                    {{ tag }}
                </button>
            {% endfor %}
        </div>
    {% endif %}

    <!-- Start and more -->
    <div class="mt-auto flex flex-col gap-2 border-t border-gray-200 p-4 dark:border-gray-600">
        {% for action in actions %}
            {% if action.disabled %}
                <span class="btn btn-{{ action.type }}" aria-disabled="true">{{ action.text }}</span>
            {% else %}
                <a
                    href="{{ action.url }}"
                    class="btn btn-{{ action.type }}"
                    {% if action.external %}target="_blank" rel="noopener"{% endif %}
                >
                    {{ action.text }}
                </a>
            {% endif %}
        {% endfor %}
    </div>
</div>
