{% load i18n %}

<div class="-mb-16">
    <svg viewBox="0 0 500 15" class="absolute">
        <polyline class="fill-white/25 drop-shadow-xs drop-shadow-gray-500 dark:drop-shadow-gray-800" points="-10,0 500,0 -10,15"/>
    </svg>
    <div class="bg-insight-primary text-white leading-loose text-lg px-4 md:px-16 pt-20 pb-4">
        {% if title %}
            <h1 class="text-white text-4xl md:text-5xl font-bold">{{ title }}</h1>
        {% endif %}

        {% if description %}
            <p class="text-gray-200 leading-loose text-lg mt-4">{{ description }}</p>
        {% endif %}

        {% if cta %}
            <a href="{{ cta.url }}" class="btn btn-white btn-large font-bold w-fit">{{ cta.label }}</a>
        {% endif %}
    </div>
    <svg viewBox="0 0 500 50" class="-z-10">
        <polyline class="fill-insight-primary/25 drop-shadow-xs drop-shadow-gray-500 dark:drop-shadow-gray-800" points="-10,0 450,0 -10,30"/>
        <polyline class="fill-insight-primary/25 drop-shadow-xs drop-shadow-gray-500 dark:drop-shadow-gray-800" points="-10,0 225,0 -10,45"/>
        <polyline class="fill-insight-primary drop-shadow-xs drop-shadow-gray-500 dark:drop-shadow-gray-800" points="-10,0 510,0 -10,15"/>
    </svg>
</div>
