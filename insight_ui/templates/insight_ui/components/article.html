{% load i18n %}

<article>
    {% if article_config.title %}
        <h2>{{ article_config.title }}</h2>
    {% endif %}

    <div style="columns: {{ article_config.columns }}; column-gap: {{ article_config.column_gap }}; column-rule: 1px solid currentColor; column-rule-color: var(--color-gray-300);"
         class="text-secondary leading-loose text-justify">
        {{ article_config.content|safe }}
    </div>
</article>
