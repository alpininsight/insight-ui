<div class="flex flex-col space-y-2">
    <div class="relative">
        <label for="{{ slider.id }}" class="sr-only">{{ slider.title }}</label>
        <input id="{{ slider.id }}" type="range" value="{{ slider.value }}" min="{{ slider.min }}" max="{{ slider.max }}" class="w-full h-2 bg-gray-200 dark:bg-gray-700 rounded-sm appearance-none cursor-pointer">
        <div class="flex justify-between w-full text-sm text-insight-text-secondary dark:text-insight-text-secondary-dark">
            {% for item in slider.items %}
                <span>{{ item }}</span>
            {% endfor %}
        </div>
    </div>
</div>
