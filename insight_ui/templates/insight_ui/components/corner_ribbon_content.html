{% if corner_ribbon_config.request_url %}
  <a
    href="{{ corner_ribbon_config.request_url }}"
    class="block py-4 text-center {{ corner_ribbon_config.background_class }} {{ rotation }} font-bold {{ corner_ribbon_config.foreground_class }} shadow-insight-raised focus:outline-none focus:ring-2 focus:ring-insight-focus focus:ring-offset-2"
    aria-label="{{ corner_ribbon_config.aria_label|default:corner_ribbon_config.text }}"
  >{{ corner_ribbon_config.text }}</a>
{% else %}
  <div class="py-4 text-center {{ corner_ribbon_config.background_class }} {{ rotation }} font-bold {{ corner_ribbon_config.foreground_class }} shadow-insight-raised">
    {{ corner_ribbon_config.text }}
  </div>
{% endif %}
