<div
  data-accordion="{{ group_id }}"
  data-accordion-exclusive="{{ exclusive|yesno:'true,false' }}"
  class="rounded-sm overflow-hidden"
>
  {% for item in items %}
    {% with forloop.counter0|stringformat:"s" as idx %}
      {% with group_id|add:"-panel-"|add:idx as panel_id %}
        <div class="bg-white dark:bg-gray-800">
          <h3 class="text-primary mb-1">
            <button
              class="flex justify-between items-center w-full border-b border-gray-300 dark:border-gray-600 px-4 py-3 scroll-mt-24 focus:outline-none focus-visible:ring-2 ring-insight-primary"
              aria-expanded="false"
              aria-controls="{{ panel_id }}"
              id="{{ panel_id }}-header"
            >
              <span>{{ item.question }}</span>
              <svg class="size-4 ml-2 transform transition-transform duration-300" aria-hidden="true" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 011.08 1.04l-4.25 4.25a.75.75 0 01-1.08 0L5.21 8.27a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
              </svg>
            </button>
          </h3>
          <div
            id="{{ panel_id }}"
            class="accordion-content px-4 overflow-hidden transition-all duration-300 ease-in-out"
            role="region"
            aria-labelledby="{{ panel_id }}-header"
            style="height: 0; opacity: 0;"
          >
            <div class="py-4">
              <p class="text-secondary">{{ item.answer }}</p>
            </div>
          </div>
        </div>
      {% endwith %}
    {% endwith %}
  {% endfor %}
</div>
