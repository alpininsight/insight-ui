{% if style == "waves" %}
    <svg
        viewBox="0 0 500 {{ height }}"
        preserveAspectRatio="none"
        class="block w-full -z-10"
        style="height: {{ height }}px; --heading-decoration-color: {{ color }}; --heading-decoration-muted-color: color-mix(in srgb, var(--heading-decoration-color) 25%, transparent);"
        aria-hidden="true"
        data-heading-decoration="waves"
    >
        <polyline
            style="fill: var(--heading-decoration-muted-color)"
            class="drop-shadow-xs drop-shadow-gray-500 dark:drop-shadow-gray-800"
            points="-10,0 450,0 -10,{{ wave_back_y }}"/>
        <polyline
            style="fill: var(--heading-decoration-muted-color)"
            class="drop-shadow-xs drop-shadow-gray-500 dark:drop-shadow-gray-800"
            points="-10,0 250,0 -10,{{ wave_middle_y }}"/>
        <polyline
            style="fill: var(--heading-decoration-color)"
            class="drop-shadow-xs drop-shadow-gray-500 dark:drop-shadow-gray-800"
            points="-10,0 510,0 -10,{{ wave_front_y }}"/>
    </svg>
{% elif style == "image" %}
    <div
        class="block w-full -z-10 bg-center bg-cover bg-no-repeat drop-shadow-xs drop-shadow-gray-500 dark:drop-shadow-gray-800"
        style="height: {{ height }}px; --heading-decoration-color: {{ color }}; background-color: color-mix(in srgb, var(--heading-decoration-color) 12%, transparent);{% if image_url %} background-image: url('{{ image_url }}');{% endif %}"
        aria-hidden="true"
        data-heading-decoration="image"
    ></div>
{% elif style == "gradient" %}
    <div
        class="block w-full -z-10 drop-shadow-xs drop-shadow-gray-500 dark:drop-shadow-gray-800"
        style="height: {{ height }}px; --heading-decoration-color: {{ color }}; background: linear-gradient(to bottom, var(--heading-decoration-color), transparent);"
        aria-hidden="true"
        data-heading-decoration="gradient"
    ></div>
{% endif %}
{# style == "none" renders no markup. #}
