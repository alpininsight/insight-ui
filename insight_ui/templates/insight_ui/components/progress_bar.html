
<div class="w-full insight-surface-muted h-4 insight-radius-pill">
    <div class="bg-insight-primary h-4 insight-radius-pill animate-progress-bar" id="progress-bar" style="width: 0%"></div>
</div>

<style>
    .animate-progress-bar {
        transition: width 0.5s ease-in-out;
    }
</style>

<script>
    let progress = 0;
    const progressBar = document.getElementById("progress-bar");

    function simulateDownload() {
        if (progress < 100) {
            progress += 1;
            progressBar.style.width = progress + "%";
        } else {
            clearInterval(downloadInterval);
        }
    }

    const downloadInterval = setInterval(simulateDownload, 100);
</script>
