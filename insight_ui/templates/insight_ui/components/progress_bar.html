<div class="relative">
    {% if progress_bar_config.label %}
        <div class="flex justify-between items-center mb-1">
            <span id="{{ progress_bar_config.tag_id }}-label" class="text-sm font-medium text-gray-700 dark:text-gray-300">
                {{ progress_bar_config.label }}
            </span>
            {% if progress_bar_config.show_value %}
                <span id="{{ progress_bar_config.tag_id }}-value" class="text-sm font-medium text-gray-700 dark:text-gray-300" aria-hidden="true">
                    {{ progress_bar_config.value }}%
                </span>
            {% endif %}
        </div>
    {% elif progress_bar_config.show_value %}
        <div class="flex justify-end mb-1">
            <span id="{{ progress_bar_config.tag_id }}-value" class="text-sm font-medium text-gray-700 dark:text-gray-300" aria-hidden="true">
                {{ progress_bar_config.value }}%
            </span>
        </div>
    {% endif %}

    <div class="group relative cursor-pointer"
         role="progressbar"
         aria-valuenow="{{ progress_bar_config.value }}"
         aria-valuemin="{{ progress_bar_config.min_value }}"
         aria-valuemax="{{ progress_bar_config.max_value }}"
         {% if progress_bar_config.label %}aria-labelledby="{{ progress_bar_config.tag_id }}-label"{% endif %}
         aria-valuetext="{{ progress_bar_config.value }}% {% if progress_bar_config.label %}{{ progress_bar_config.label }}{% endif %}"
         tabindex="0">
        <div class="w-full h-4 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">
            <div id="{{ progress_bar_config.tag_id }}"
                 class="h-full bg-blue-600 rounded-full transition-all duration-500 ease-in-out"
                 style="width: {{ progress_bar_config.value }}%"
                 data-value="{{ progress_bar_config.value }}"
                 data-label="{{ progress_bar_config.label }}">
            </div>
        </div>
        <span class="absolute bottom-full left-0 -translate-x-1/2 -translate-y-2 bg-gray-800 text-white py-2 px-3 rounded-md text-sm whitespace-nowrap opacity-0 invisible group-hover:opacity-100 group-hover:visible group-focus:opacity-100 group-focus:visible transition-[opacity,visibility] duration-200 ease-in-out z-50 pointer-events-none"
              role="tooltip"
              aria-hidden="true">
            <span class="absolute top-full left-1/2 -translate-x-1/2 border-x-[6px] border-t-[6px] border-x-transparent border-t-gray-800"></span>
        </span>
    </div>
</div>

<script>
    (function() {
        const tagId = '{{ progress_bar_config.tag_id }}';
        const fill = document.getElementById(tagId);
        if (!fill) return;

        const track = fill.closest('[role="progressbar"]');
        if (!track) return;

        const tooltip = track.querySelector('[role="tooltip"]');
        if (!tooltip) return;

        function updateTooltipContent() {
            const value = fill.dataset.value;
            const label = fill.dataset.label;
            const arrow = tooltip.querySelector('span');
            tooltip.textContent = label ? `${label}: ${value}%` : `${value}%`;
            if (arrow) tooltip.appendChild(arrow);
        }

        function updateTooltipPosition(event) {
            const rect = track.getBoundingClientRect();
            const x = Math.max(0, Math.min(event.clientX - rect.left, rect.width));
            tooltip.style.left = `${x}px`;
        }

        updateTooltipContent();

        track.addEventListener('mousemove', updateTooltipPosition);
        track.addEventListener('focus', function() {
            const fillWidth = fill.offsetWidth;
            tooltip.style.left = `${Math.max(20, fillWidth)}px`;
        });

        // Support dynamic value updates
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.type === 'attributes' && mutation.attributeName === 'data-value') {
                    updateTooltipContent();
                }
            });
        });
        observer.observe(fill, { attributes: true });
    })();
</script>
