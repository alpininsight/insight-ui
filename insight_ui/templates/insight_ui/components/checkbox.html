{% load insight_tags %}

<div>
    <label class="flex gap-1 items-center">
        <input
            type="checkbox"
            {% if checkbox_config.tag_id %}id="{{ checkbox_config.tag_id }}"{% endif %}
            name="{{ checkbox_config.name }}"
            value="{{ checkbox_config.value }}"
            {% if checkbox_config.checked %}checked{% endif %}
            {% if checkbox_config.required %}required{% endif %}
            {% if checkbox_config.disabled %}disabled{% endif %}
            {% data_attributes checkbox_config.data_attrs %}
            {% include "insight_ui/components/_form_field_aria.html" with field_id=checkbox_config.message_id help_text=checkbox_config.help_text error_text=checkbox_config.error_text disabled=checkbox_config.disabled disabled_reason=checkbox_config.disabled_reason %}
            class="accent-insight-primary"
        >
        <span class="{% if checkbox_config.disabled %}text-insight-body{% else %}text-insight-headline{% endif %} text-sm">{{ checkbox_config.label }}{% if checkbox_config.required %} <span class="text-insight-danger-text" aria-hidden="true">*</span>{% endif %}</span>
    </label>
    {% include "insight_ui/components/_form_field_messages.html" with field_id=checkbox_config.message_id help_text=checkbox_config.help_text error_text=checkbox_config.error_text disabled=checkbox_config.disabled disabled_reason=checkbox_config.disabled_reason %}
</div>
