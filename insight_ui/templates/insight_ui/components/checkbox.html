<div class="flex flex-col space-y-1">
    {% if checkbox.label %}
        <span class="flex gap-1 text-sm font-bold text-primary mb-1">{{ checkbox.label }}</span>
    {% endif %}
    {% for item in checkbox.items %}
        <label class="flex items-center gap-1">
            <input type="checkbox" id="{{ item.id }}" name="{{ checkbox.name }}" value="{{ item.value }}" {% if item.disabled %}disabled{% endif %}>
            <span class="{% if item.disabled %}text-secondary{% else %}text-primary{% endif %} text-sm">{{ item.text }}</span>
        </label>
    {% endfor %}
</div>
