{% load i18n %}

<div class="w-3xl mx-auto">
    <!-- Response-container -->
    <div class="my-2 grow" id="response"></div>

    <!-- Input-container -->
    <form hx-post="{% url view_name %}" hx-swap="beforeend" hx-target="#response" class="mt-16 space-y-2">
        {% csrf_token %}
        <label class="block text-sm font-medium text-insight-text-secondary dark:text-insight-text-secondary-dark" for="msg">
            {% trans "Message" %}
        </label>
        <div class="flex gap-2">
            <input class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-sm shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white transition-colors duration-200" id="msg" name="msg" type="text" placeholder="{% trans 'Write something...' %}">
            <button class="btn btn-primary" type="submit">
                {% trans "Send" %}
            </button>
        </div>
    </form>
</div>
