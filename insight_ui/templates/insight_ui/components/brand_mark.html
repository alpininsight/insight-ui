{% load i18n insight_tags %}

<div class="flex gap-2 items-center min-w-0 sm:gap-3 {% if brand_mark_config.logo_position == 'end' %}justify-between{% endif %} {{ brand_mark_config.css_class }}">
    <span class="shrink-0 {% if brand_mark_config.logo_position == 'end' %} order-2{% endif %}" aria-hidden="true">
        {% logo config=brand_mark_config.logo %}
    </span>
    <span class="text-sm tracking-tight whitespace-nowrap sm:text-xl">
        <span class="font-medium text-insight-headline">{{ brand_mark_config.primary_text }}</span>
        <span class="font-bold text-insight-secondary">{{ brand_mark_config.secondary_text }}</span>
    </span>
</div>
