{% load i18n insight_tags %}

<div class="carousel_wrapper relative size-full overflow-hidden">
    <div id="threeD_carousel" style="--quantity: {{ carousel_items|length }}" class="threeD_carousel absolute top-5 left-1/2 h-[35vh] w-full">
      {% for item in carousel_items %}
        <div style="--position: {{ forloop.counter }}" class="item absolute inset-0 flex justify-center">
            {% card title=item.title subtitle=item.subtitle content=item.content actions=item.actions %}
        </div>
      {% endfor %}
    </div>
    <!-- Controls -->
    <div class="absolute flex justify-between gap-4 bottom-10 sm:bottom-10 left-1/2 -translate-x-1/2 px-8 lg:px-0">
        <button id="previous" class="btn btn-primary">
            <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
            </svg>
            {% trans 'Zurück' %}
        </button>
        <button id="next" class="btn btn-primary">
            {% trans 'Weiter' %}
            <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
            </svg>
        </button>
    </div>
</div>

<style>

    .threeD_carousel
    {
        transform-style: preserve-3d;
        transform: translateX(-50%) perspective(1000px) translateZ(-850px) rotateX(-20deg);
        {% comment %} translateZ defines how big (how far away) the screens are (lg: 750 3xl: 550)
        {% comment %} animation: spin 60s linear infinite; {% endcomment %}
    }

    .threeD_carousel .item
    {
        /* outline: 1px solid transparent; */ /* fake antialiasing */
        /* -webkit-backface-visibility: hidden; */ /* backface culling */
        transform:
            rotateY(calc((var(--position) - 1) * (360 / var(--quantity)) * 1deg))
            translateZ(500px) /* defines how far away the screens are from the center of the carousel */
            rotateX(20deg);
    }

    /* NOT IN USE */
    @keyframes spin
    {
        from
        {
            transform: translateX(-50%) perspective(1000px) translateZ(-1000px) rotateX(-20deg) rotateY(0deg);
        }
        to
        {
            transform: translateX(-50%) perspective(1000px) translateZ(-1000px) rotateX(-20deg) rotateY(360deg);
        }
    }

    @media screen and (min-width: 640px)
    {
        .carousel_wrapper .threeD_carousel
        {
            transform: translateX(-50%) perspective(1000px) translateZ(-1100px) rotateX(-20deg);
        }

        .carousel_wrapper .threeD_carousel .item
        {
            transform:
                rotateY(calc((var(--position) - 1) * (360 / var(--quantity)) * 1deg))
                translateZ(600px) /* defines how far away the screens are from the center of the carousel */
                rotateX(20deg);
        }
    }

    @media screen and (min-width: 1024px)
    {
        .carousel_wrapper .threeD_carousel
        {
            transform: translateX(-50%) perspective(1000px) translateZ(-750px) rotateX(-20deg);
        }

        .carousel_wrapper .threeD_carousel .item
        {
            transform:
                rotateY(calc((var(--position) - 1) * (360 / var(--quantity)) * 1deg))
                translateZ(600px) /* defines how far away the screens are from the center of the carousel */
                rotateX(20deg);
        }
    }

    @media screen and (min-width: 1536px)
    {
        .carousel_wrapper .threeD_carousel
        {
            transform: translateX(-50%) perspective(1000px) translateZ(-750px) rotateX(-20deg);
        }

        .carousel_wrapper .threeD_carousel .item
        {
            transform:
                rotateY(calc((var(--position) - 1) * (360 / var(--quantity)) * 1deg))
                translateZ(600px) /* defines how far away the screens are from the center of the carousel */
                rotateX(20deg);
        }
    }

    @media screen and (min-width: 1920px)
    {
        .carousel_wrapper .threeD_carousel
        {
            transform: translateX(-50%) perspective(1000px) translateZ(-550px) rotateX(-20deg);
        }

        .carousel_wrapper .threeD_carousel .item
        {
            transform:
                rotateY(calc((var(--position) - 1) * (360 / var(--quantity)) * 1deg))
                translateZ(800px) /* defines how far away the screens are from the center of the carousel */
                rotateX(20deg);
        }
    }
</style>

<script>
    // Media-Queries
    var screens = [
        window.matchMedia('(min-width: 640px)'),
        window.matchMedia('(min-width: 1024px)'),
        window.matchMedia('(min-width: 1536px)'),
        window.matchMedia('(min-width: 1920px)')
    ]

    // Distances: first -> smallest screen, last -> biggest screen
    var distances = [-1100, -750, -750, -550];
    var angle = 360 / 5;

    previous = document.getElementById("previous");
    next = document.getElementById("next");

    carousel = document.getElementById("threeD_carousel");

    var currentIndex = 0;

    function spin(index, toRight)
    {
        /* get the correct for the current window width (media-query) */
        distance = -850;
        for (let i = screens.length - 1; i >= 0; i--)
        {
            if (screens[i].matches)
            {
                distance = distances[i];
                break;
            }
        }

        /* adjust start index, in relation to the spin direction */
        fromIndex = index;

        if (toRight) fromIndex += 1;
        else fromIndex -= 1

        /* apply animation */
        return [
            { transform: "translateX(-50%) perspective(1000px) translateZ(" + distance + "px) rotateX(-20deg) rotateY(" + (fromIndex * angle) + "deg)" },
            { transform: "translateX(-50%) perspective(1000px) translateZ(" + distance + "px) rotateX(-20deg) rotateY(" + (index * angle) + "deg)" },
        ];
    }

    var spinSettings = {
        duration: 1000,
        fill: "forwards",
    };

    function gotoPrevious(event)
    {
        currentIndex++;
        if (currentIndex > 4) currentIndex = 0;

        carousel.animate(spin(currentIndex, false), spinSettings);
    }

    function gotoNext(event)
    {
        currentIndex--;
        if (currentIndex < 0) currentIndex = 4;

        carousel.animate(spin(currentIndex, true), spinSettings);
    }

    previous.addEventListener("click", gotoPrevious);
    next.addEventListener("click", gotoNext);
</script>
