{% load i18n %}

<div
  {% if infinite_scroll_config.tag_id %}id="{{ infinite_scroll_config.tag_id }}"{% endif %}
  {% if infinite_scroll_config.auto_fetch %}
    hx-get="{{ infinite_scroll_config.request_url }}?page={{ infinite_scroll_config.page }}"
    hx-swap="afterend"
    hx-trigger="revealed"
    hx-infinite-scroll
    data-threshold="{{ threshold|default:100 }}"
    data-next-url="{{ infinite_scroll_config.request_url }}?page={{ infinite_scroll_config.page }}"
    hx-ext="infinite-scroll,progressive-enhancement"
  {% endif %}
>
  <!-- Existing Content -->
  <div>
    {% for item in infinite_scroll_config.items %}
      <div class="bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg p-4 mb-4">
        <h3>{{ item.title }}</h3>
        <p class="text-secondary">{{ item.content }}</p>
      </div>
    {% endfor %}
  </div>

  {% if not infinite_scroll_config.auto_fetch %}
    <button
      class="btn btn-primary btn-l mx-auto"
      hx-get="{{ infinite_scroll_config.request_url }}?page={{ infinite_scroll_config.page }}&auto_fetch={{ infinite_scroll_config.auto_fetch }}"
      hx-swap="outerHTML"
      hx-trigger="click"
      hx-ext="progressive-enhancement"
    >
      {% trans "Load more" %}
    </button>
  {% endif %}

  <!-- Loading Indicator -->
  <div class="htmx-spinner" style="display: none;">
    <div class="flex items-center justify-center py-4">
      <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-insight-primary"></div>
      <span class="ml-2 text-sm text-secondary">{% trans 'More content is loading...' %}</span>
    </div>
  </div>
</div>
