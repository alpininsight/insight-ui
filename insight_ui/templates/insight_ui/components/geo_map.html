{% load static %}

<div id="map" class="z-0 h-96"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
  var map = L.map('map').setView([52.5163, 13.3777], 6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  var svgMarkup = `
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="red" class="size-6">
    <path fill-rule="evenodd" d="M3 2.25a.75.75 0 0 1 .75.75v.54l1.838-.46a9.75 9.75 0 0 1 6.725.738l.108.054A8.25 8.25 0 0 0 18 4.524l3.11-.732a.75.75 0 0 1 .917.81 47.784 47.784 0 0 0 .005 10.337.75.75 0 0 1-.574.812l-3.114.733a9.75 9.75 0 0 1-6.594-.77l-.108-.054a8.25 8.25 0 0 0-5.69-.625l-2.202.55V21a.75.75 0 0 1-1.5 0V3A.75.75 0 0 1 3 2.25Z" clip-rule="evenodd" />
    </svg>`;

  var svgDivIcon = L.divIcon({
    className: '', // kein zusätzliches CSS
    html: svgMarkup,
    iconSize: [32, 32],
    iconAnchor: [3, 22],
    popupAnchor: [0, -30]
  });

  // Layergruppe: Hansestädte
  var hansestaedte = L.layerGroup([
    L.marker([53.55073, 9.99302], { icon: svgDivIcon }).bindPopup("<b>Hamburg</b>"),
    L.marker([53.07582, 8.80717], { icon: svgDivIcon }).bindPopup("<b>Bremen</b>"),
    L.marker([53.867, 10.692], { icon: svgDivIcon }).bindPopup("<b>Lübeck</b>"),
    L.marker([54.09, 12.14], { icon: svgDivIcon }).bindPopup("<b>Rostock</b>"),
    L.marker([54.311, 13.082], { icon: svgDivIcon }).bindPopup("<b>Stralsund</b>"),
    L.marker([53.891, 11.462], { icon: svgDivIcon }).bindPopup("<b>Wismar</b>"),
    L.marker([53.246421, 10.411518], { icon: svgDivIcon }).bindPopup("<b>Lüneburg</b>")
  ]);

  // Layergruppe: Sehenswürdigkeiten
  var sehenswuerdigkeiten = L.layerGroup([
    L.marker([52.51627, 13.37769]).bindPopup("<b>Brandenburger Tor</b> (Berlin)"),
    L.marker([47.5576, 10.7498]).bindPopup("<b>Schloss Neuschwanstein</b> (Bayern)"),
    L.marker([50.9413, 6.9583]).bindPopup("<b>Kölner Dom</b>"),
    L.marker([48.1391, 11.5802]).bindPopup("<b>Marienplatz</b> (München)"),
    L.marker([51.0504, 13.7373]).bindPopup("<b>Frauenkirche</b> (Dresden)")
  ]);

  // Beide Layer zur Karte hinzufügen
  hansestaedte.addTo(map);
  sehenswuerdigkeiten.addTo(map);

  // Layer-Kontrollleiste
  var overlayMaps = {
    "Hansestädte": hansestaedte,
    "Sehenswürdigkeiten": sehenswuerdigkeiten
  };

  L.control.layers(null, overlayMaps, { collapsed: false }).addTo(map);
</script>
