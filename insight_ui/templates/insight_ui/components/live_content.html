{% load i18n insight_tags %}

<div
    {% if live_content_config.tag_id %}id="{{ live_content_config.tag_id }}"{% endif %}
    {# Background polling stays out of the global loading bar unless the HtmxConfig asks for it. #}
    {% htmx_attributes htmx request_url=live_content_config.request_url trigger=trigger indicator="find .htmx-indicator" global_indicator=False %}
    class="insight-live-content"
    aria-live="polite"
    aria-busy="false"
    tabindex="-1"
>
    {# Loading Spinner #}
    <div class="htmx-indicator" role="status">
        <div class="animate-spin w-8 h-8 border-b-2 border-insight-primary rounded-insight-full" aria-hidden="true"></div>
        <span class="ml-2 text-sm text-insight-body">{% trans 'Loading...' %}</span>
    </div>

    {# Content #}
    {% if live_content_config.initial_content %}
        {{ live_content_config.initial_content|safe }}
    {% else %}
        <div>
            <p class="text-insight-body">{% trans 'Content is loading...' %}</p>
        </div>
    {% endif %}
</div>

<script>
    document.body.addEventListener('htmx:configRequest', function(evt) {
        const target = evt.target;
        if(target.classList.contains('insight-live-content')) {
            target.setAttribute('aria-busy', 'true');
        }
    });

    document.body.addEventListener('htmx:afterSwap', function(evt) {
        const target = evt.target;
        if(target.classList.contains('insight-live-content')) {
            target.setAttribute('aria-busy', 'false');
            // Optional: Focus on updated content
            // target.focus({ preventScroll: true });
        }
    });
</script>
