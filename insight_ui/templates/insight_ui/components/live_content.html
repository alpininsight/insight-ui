{% load i18n %}

<div
  class="insight-live-content"
  {% if options.id %}id="{{ options.id }}"{% endif %}
  {% if options.htmx %}
    hx-get="{{ options.htmx.url }}"
    {% if options.htmx.trigger %}hx-trigger="{{ options.htmx.trigger }}"{% else %}hx-trigger="load, every 20s"{% endif %}
    {% if options.htmx.swap %}hx-swap="{{ options.htmx.swap }}"{% else %}hx-swap="innerHTML"{% endif %}
    hx-ext="progressive-enhancement"
    data-loading-class="insight-live-content--loading"
  {% endif %}
>
  <!-- Loading Spinner -->
  <div class="htmx-spinner" style="display: none;">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-insight-primary"></div>
    <span class="ml-2 text-sm text-insight-text-secondary">{% trans 'Loading...' %}</span>
  </div>

  <!-- Content is loaded here -->
  {% if initial_content %}
    {{ initial_content|safe }}
  {% else %}
    <div>
      <p class="text-insight-text-secondary">{% trans 'Content is loading...' %}</p>
    </div>
  {% endif %}
</div>
