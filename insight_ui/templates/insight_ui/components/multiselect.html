{% load i18n %}

<div data-multiselect data-name="{{ name }}" data-max="{{ maximum }}" data-selected="{{ selected_options|default:"" }}">
    <label id="{{ name }}-label" class="block text-sm font-bold text-primary mb-1">{{ label }}</label>
    {% if show_buttons %}
        <div class="flex gap-2 mb-1">
            <button type="button" class="select-all btn btn-primary btn-sm">{% trans "Alle auswählen" %}</button>
            <button type="button" class="deselect-all btn btn-primary btn-sm">{% trans "Alle abwählen" %}</button>
        </div>
    {% endif %}
    <div class="relative" role="combobox" aria-labelledby="{{ name }}-label" aria-haspopup="listbox" aria-expanded="false" aria-owns="{{ name }}-listbox">
        <div class="selected flex flex-wrap items-center gap-1 input" aria-controls="{{ name }}-listbox" aria-activedescendant="" aria-autocomplete="list" aria-multiselectable="true">
            <span class="tags flex flex-wrap gap-1"></span>
            <input id="{{ name }}-search" type="text" class="search flex-1 outline-none text-sm min-w-[60px] placeholder-gray-400" placeholder="Tippen zum Suchen..." aria-label="Suche {{ label }}" />
        </div>
        <span class="ml-auto text-gray-400 text-xs info"></span>
        <div id="{{ name }}-listbox" role="listbox" class="options hidden absolute mt-1 w-full bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md shadow-lg max-h-48 overflow-y-auto z-10">
            {% for item in options %}
                <div id="{{ name }}-opt-{{ forloop.counter }}" role="option" aria-selected="false" tabindex="-1" class="option text-primary px-3 py-2 hover:bg-gray-100 dark:hover:bg-gray-800 cursor-pointer">{{ item }}</div>
            {% endfor %}
        </div>
    </div>
    <div class="sr-only" aria-live="polite" id="{{ name }}-aria-status"></div>
</div>
